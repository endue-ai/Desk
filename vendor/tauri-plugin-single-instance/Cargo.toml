[package]
edition = "2024"
rust-version = "1.90"
name = "tauri-plugin-single-instance"
version = "2.5.5-desk.1"
authors = ["Tauri Programme within The Commons Conservancy"]
build = false
exclude = [
    "/banner.png",
    "/examples",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Ensure a single instance of your tauri app is running."
readme = "README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tauri-apps/plugins-workspace"

[package.metadata.platforms.support.windows]
level = "full"
notes = ""

[package.metadata.platforms.support.linux]
level = "full"
notes = ""

[package.metadata.platforms.support.macos]
level = "full"
notes = ""

[package.metadata.platforms.support.android]
level = "none"
notes = ""

[package.metadata.platforms.support.ios]
level = "none"
notes = ""

[features]
deep-link = ["dep:tauri-plugin-deep-link"]
semver = ["dep:semver"]

[lib]
name = "tauri_plugin_single_instance"
path = "src/lib.rs"

[[test]]
name = "dbus_errors"
path = "tests/dbus_errors.rs"

[[test]]
name = "linux_bus"
path = "tests/linux_bus.rs"

[[test]]
name = "owner_exit"
path = "tests/owner_exit.rs"

[[test]]
name = "instance_lock"
path = "tests/instance_lock.rs"

[dependencies.semver]
version = "1"
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.tauri]
version = "2.12"
default-features = false

[dependencies.tauri-plugin-deep-link]
version = "2.6.3"
optional = true

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = ["net", "rt", "sync", "time"]

[dependencies.tracing]
version = "0.1"

[dev-dependencies.tauri]
version = "2.12"
features = ["test"]
default-features = false

[target.'cfg(target_os = "linux")'.dependencies.zbus]
version = "6.2"
default-features = false
features = ["tokio", "service"]

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
]

[target.'cfg(target_os = "windows")'.dev-dependencies.windows-sys]
version = "0.61"
features = ["Win32_UI_WindowsAndMessaging"]

[target.'cfg(target_os = "linux")'.dev-dependencies.tokio]
version = "1"
features = ["rt-multi-thread"]
