<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sheets</title>
    <script type="importmap">
      { "imports": { "@endue-ai/plugin-sdk": "/_desk/plugin-sdk.js" } }
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1 id="book-name">No spreadsheet open</h1>
      <p id="book-detail"></p>
    </header>
    <div id="formula" class="formula" hidden>
      <output id="cell-address" aria-label="Selected cell"></output>
      <input id="cell-content" aria-label="Cell content" readonly spellcheck="false" />
    </div>
    <form id="find" class="find" role="search" aria-label="Find in this sheet" hidden>
      <input id="find-text" type="search" aria-label="Find" placeholder="Find" autocomplete="off" />
      <button id="find-previous" type="button" aria-label="Previous match">&#x2191;</button>
      <button id="find-next" type="button" aria-label="Next match">&#x2193;</button>
      <span id="find-count" role="status"></span>
      <button id="find-close" type="button" aria-label="Close find">&#x2715;</button>
    </form>
    <main id="sheet" hidden>
      <div id="grid" class="grid" role="grid" tabindex="0" aria-multiselectable="true" aria-readonly="true">
        <div id="grid-scroll" class="scroll" tabindex="-1"><div id="grid-size"></div></div>
        <div id="grid-layer" class="layer"></div>
      </div>
      <div id="tabs" class="tabs" role="tablist" aria-label="Sheets"></div>
    </main>
    <section id="details" class="card" tabindex="-1" aria-labelledby="details-title" hidden>
      <h2 id="details-title">This file does not open as a sheet</h2>
      <p id="details-reason"></p>
      <dl>
        <dt>Name</dt>
        <dd id="details-name"></dd>
        <dt>Size</dt>
        <dd id="details-size"></dd>
        <dt>Format</dt>
        <dd id="details-format"></dd>
      </dl>
      <p id="details-cause" class="muted"></p>
    </section>
    <section id="link" class="card" tabindex="-1" aria-labelledby="link-title" hidden>
      <h2 id="link-title">A Google Sheets shortcut</h2>
      <p>This file only points to a spreadsheet in Google Drive: its cells are not in the file.</p>
      <p>Document: <span id="link-url" class="selectable"></span></p>
    </section>
    <footer>
      <p id="status" role="status"></p>
      <output id="stats" aria-label="Selection"></output>
    </footer>
    <script type="module" src="./main.js"></script>
  </body>
</html>
