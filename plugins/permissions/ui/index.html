<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Permissions</title>
    <script type="importmap">
      { "imports": { "@endue-ai/plugin-sdk": "/_desk/plugin-sdk.js" } }
    </script>
    <link rel="stylesheet" href="/_desk/tokens.css" />
    <link rel="stylesheet" href="/_desk/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="scrim" class="scrim"></div>
    <main id="grants" class="panel sheet" aria-labelledby="grants-title" hidden>
      <header class="sheet-head">
        <h1 id="grants-title" tabindex="-1">Permissions</h1>
        <button type="button" id="grants-close" class="desk-btn desk-btn-quiet">Close</button>
      </header>
      <div class="panel-body">
        <p id="grants-summary"></p>
        <section id="refused" aria-labelledby="refused-title" hidden>
          <h2 id="refused-title">Refused this session</h2>
          <p class="kind">These are refused again without asking until you allow them here.</p>
          <ul id="refused-list"></ul>
        </section>
        <div id="grants-groups"></div>
        <section id="agents" aria-labelledby="agents-title" hidden>
          <h2 id="agents-title">Agents</h2>
          <div id="agents-groups"></div>
        </section>
      </div>
    </main>
    <section
      id="prompt"
      class="panel card"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="prompt-title"
      aria-describedby="prompt-body"
      hidden
    >
      <h1 id="prompt-title"></h1>
      <div id="prompt-body" class="panel-body">
        <p id="prompt-who" class="kind"></p>
        <p id="prompt-what"></p>
        <div id="prompt-warning"></div>
        <p id="prompt-why"></p>
        <p id="prompt-asked"></p>
      </div>
      <div class="actions">
        <button type="button" data-answer="once" class="desk-btn">Allow once</button>
        <button type="button" data-answer="session" class="desk-btn">Allow this session</button>
        <button type="button" data-answer="always" class="desk-btn">Always allow</button>
        <button type="button" data-answer="parent" hidden class="desk-btn"></button>
        <button type="button" data-answer="refuse" class="desk-btn">Don't allow</button>
      </div>
      <p id="prompt-waiting"></p>
    </section>
    <section
      id="approval"
      class="panel card"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="approval-title"
      aria-describedby="approval-body"
      hidden
    >
      <h1 id="approval-title"></h1>
      <div id="approval-body" class="panel-body">
        <p id="approval-who" class="kind"></p>
        <p id="approval-what"></p>
        <pre id="approval-preview" class="preview" tabindex="0" aria-label="Preview" hidden></pre>
        <p id="approval-more" class="kind" hidden>More changes are not shown.</p>
        <p id="approval-size"></p>
        <p id="approval-task"></p>
      </div>
      <div class="actions" data-for="approval">
        <button type="button" data-answer="once" class="desk-btn">Allow once</button>
        <button type="button" data-answer="task" class="desk-btn">Allow for this task</button>
        <button type="button" data-answer="deny" class="desk-btn">Deny</button>
      </div>
      <div class="actions" data-for="result" hidden>
        <button type="button" data-answer="undo" hidden class="desk-btn">Undo</button>
        <button type="button" data-answer="done" class="desk-btn">Done</button>
      </div>
      <p id="approval-waiting"></p>
    </section>
    <p id="status" role="status"></p>
    <script type="module" src="./main.js"></script>
  </body>
</html>
