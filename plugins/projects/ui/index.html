<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Projects</title>
    <script type="importmap">
      { "imports": { "@endue-ai/plugin-sdk": "/_desk/plugin-sdk.js" } }
    </script>
    <link rel="stylesheet" href="/_desk/tokens.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./views.css" />
    <link rel="stylesheet" href="./time.css" />
  </head>
  <body>
    <header id="bar">
      <h1 id="title">Projects</h1>
      <div id="views" role="tablist" aria-label="Views"></div>
      <input
        id="search"
        type="search"
        placeholder="Search (/)"
        aria-label="Search tasks"
        autocomplete="off"
      />
      <label id="group-control" class="control">
        Group <select id="group" aria-label="Group by"></select>
      </label>
      <select id="source" aria-label="Source"></select>
      <label class="control"><input id="done" type="checkbox" /> Done</label>
      <div id="period" class="tools" role="toolbar" aria-label="Period" hidden>
        <button id="prev" type="button" title="Previous ([)" aria-label="Previous">‹</button>
        <button id="today" type="button" title="Today (t)">Today</button>
        <button id="next" type="button" title="Next (])" aria-label="Next">›</button>
        <span id="period-title"></span>
        <select id="zoom" aria-label="Zoom">
          <option value="week">2 weeks</option>
          <option value="month">6 weeks</option>
          <option value="quarter">Quarter</option>
        </select>
      </div>
      <button id="refresh" type="button" title="Refresh" aria-label="Refresh">
        <span aria-hidden="true">↻</span>
      </button>
    </header>
    <main id="body" tabindex="0" aria-label="Tasks" aria-busy="false"></main>
    <aside id="detail" tabindex="-1" aria-labelledby="detail-title" hidden></aside>
    <p id="status" role="status"></p>
    <script type="module" src="./main.js"></script>
  </body>
</html>
