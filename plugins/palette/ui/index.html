<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Palette</title>
    <script type="importmap">
      { "imports": { "@endue-ai/plugin-sdk": "/_desk/plugin-sdk.js" } }
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="scrim" data-testid="scrim"></div>
    <div class="box" role="dialog" aria-modal="true" aria-labelledby="title">
      <p id="title" class="title" data-testid="title">Run a command</p>
      <input
        data-testid="query"
        role="combobox"
        aria-expanded="true"
        aria-controls="results"
        aria-autocomplete="list"
        maxlength="256"
        aria-label="Search Desk and this computer"
        autocomplete="off"
        spellcheck="false"
      />
      <ul id="results" role="listbox" data-testid="results" aria-labelledby="title"></ul>
      <p class="status" role="status" aria-live="polite" data-testid="status"></p>
      <footer>↑↓ Navigate <span>↵ Open</span> <span>Esc Close</span></footer>
      <div class="actions" data-testid="actions" aria-live="polite" hidden></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
