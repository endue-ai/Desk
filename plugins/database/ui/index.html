        <p class="buttons">
          <button type="button" id="import-cancel" class="desk-btn desk-btn-quiet" data-message="index.cancel"></button>
          <button type="submit" id="import-run" class="desk-btn desk-btn-primary" data-message="index.import"></button>
        </p>
      </form>
    </main>
    <footer>
      <p id="hints"></p>
      <p id="totals"></p>
      <p id="summary" aria-live="polite"></p>
      <p id="status" role="status"></p>
    </footer>
    <script type="module" src="./main.js"></script>
  </body>
</html>
