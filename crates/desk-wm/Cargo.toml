[package]
name = "desk-wm"
description = "The desk's window manager as a model: geometry and coordinate spaces, 8-way snap, tiling and cascade, the spread, the canvas pan and the minimap, panes, desktops, focus, the drawer and one Desk state with its snapshot. Plain serde data in and out; no clock, no I/O, no rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The snapshot is the contract's own type (`BrainDesk`, specs/bridge/v0), what desk.windows.list answers.
desk-bridge.workspace = true
serde.workspace = true
# Stored desktops and layouts are read leniently from JSON, as the runtime reads them.
serde_json.workspace = true
# The spread's filter folds titles as the runtime does (NFKC, then lower case).
unicode-normalization = "0.1"

[lints]
workspace = true
