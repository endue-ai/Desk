[package]
name = "desk-sys"
description = "Primitives: fs (notify), proc (portable-pty), net and audio (cpal, wake word), each behind a cargo feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
## File primitives: read, write, list and watch.
fs = ["dep:notify"]
## Processes: spawn with pipes or in a pseudo-terminal, write, resize, signal.
proc = ["dep:portable-pty", "dep:nix"]
## One HTTP(S) request at a time, no redirects followed.
net = ["dep:ureq"]
## Captures and the wake-word interface, without a device.
audio = []
## The system microphone through cpal (Linux builds need the ALSA headers, libasound2-dev).
microphone = ["audio", "dep:cpal"]

[dependencies]
cpal = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
portable-pty = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, optional = true }

[[test]]
name = "fs"
required-features = ["fs"]

[[test]]
name = "proc"
required-features = ["proc"]

[[test]]
name = "net"
required-features = ["net"]

[[test]]
name = "audio"
required-features = ["audio"]

[lints]
workspace = true
