[package]
name = "desk-plugin-host"
description = "Wasmtime host for logic plugins and Wasm connectors, and supervisor for MCP tool plugins (MCP runs inside desk-vm)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
desk-bridge.workspace = true
serde_json.workspace = true
wasmtime = { version = "49.0.4", default-features = false, features = ["component-model", "cranelift", "parallel-compilation", "runtime", "std"] }
wasmtime-wasi = { version = "49.0.4", default-features = false, features = ["p2"] }

[dev-dependencies]
wat = "1"
wit-parser.workspace = true

[lints]
workspace = true
