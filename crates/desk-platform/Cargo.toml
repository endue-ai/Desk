[package]
name = "desk-platform"
description = "Client of endue AI's platform API subset (specs/platform/v0): the person's endue AI agents, the agent catalog and conversations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
## An in-process fake of the platform on 127.0.0.1 (`desk_platform::fake`), for tests only.
fake = []

[dependencies]
# HTTPS over rustls with the host allowlist and the system proxy, as every other desk request.
desk-sys = { workspace = true, features = ["net"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The crate's own tests run against its fake.
desk-platform = { path = ".", features = ["fake"] }
jsonschema.workspace = true
yaml_serde.workspace = true

[lints]
workspace = true
