[package]
name = "russh-util"
version = "0.52.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "SSH task support with the upstream monotonic WebAssembly clock"

[lib]
name = "russh_util"
path = "src/lib.rs"

[dependencies.tokio]
version = "1.17.0"
features = [
    "sync",
    "macros",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio]
version = "1.17.0"
features = [
    "io-util",
    "rt-multi-thread",
    "rt",
]

[target.'cfg(target_arch = "wasm32")'.dependencies.web-time]
version = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen-futures]
version = "0.4.43"
