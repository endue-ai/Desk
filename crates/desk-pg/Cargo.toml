[package]
name = "desk-pg"
description = "PostgreSQL sessions for the core's db.* (ADR 0281): protocol 3.0 on postgres-protocol over tokio and rustls (ring), SCRAM and SCRAM-PLUS, the TLS modes, text results in pages, cancel, COPY, notices and notifications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The protocol's messages, SCRAM and the error fields, pinned: the session on them is ours (ADR 0281).
postgres-protocol = "=0.6.12"
bytes = "1"
fallible-iterator = "0.2"
# One runtime thread for every session; no macros.
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "io-util", "time", "sync"] }
# The TLS stack desk-sys uses: rustls 0.23 with ring, and the OS's trust store.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7"
# SCRAM's channel binding hashes the server's certificate.
sha2 = "0.11"

[lints]
workspace = true
