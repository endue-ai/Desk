[package]
name = "desk-mcp-client"
description = "Desk as an MCP client: the MCP servers init.yaml lists start over stdio as callers of their own, and their tools become agents' commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
desk-bridge.workspace = true
desk-core.workspace = true
jsonschema.workspace = true
serde_json.workspace = true

# A small MCP server the tests start as a real process (CARGO_BIN_EXE_desk-mcp-fixture). It is a test
# fixture, not a program Desk ships.
[[bin]]
name = "desk-mcp-fixture"
path = "tests/fixture/server.rs"
test = false
bench = false
doc = false

[lints]
workspace = true
