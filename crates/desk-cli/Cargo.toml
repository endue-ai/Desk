[package]
name = "desk-cli"
default-run = "endue"
description = "The endue CLI and its desk compatibility command: headless brain turns, local plugin tools and the app socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "desk"
path = "src/main.rs"

[[bin]]
name = "endue"
path = "src/bin/endue.rs"

[dependencies]
desk-brain.workspace = true
desk-brain-endue.workspace = true
desk-bridge.workspace = true
desk-core.workspace = true
desk-crash.workspace = true
desk-trace.workspace = true
# Not in [workspace.dependencies] yet: a later chore moves it there.
desk-ipc = { path = "../desk-ipc" }
desk-mcp = { path = "../desk-mcp" }
desk-link = { path = "../desk-link" }
desk-plugin-host.workspace = true
serde_json.workspace = true
# Already in the tree: desk export writes stored entries, import reads stored and deflated ones.
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2"] }
# zip's deflate needs a flate2 backend: the default one, miniz_oxide, already in the tree.
flate2 = "1.1.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.10.1"

[dev-dependencies]
desk-update.workspace = true

[lints]
workspace = true
