[package]
name = "desk-pg-session-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Throwaway spike for #439: ways to hold a PostgreSQL session open for endue.database"

# Its own workspace, so the repository's cargo commands and gates never build it.
[workspace]

[dependencies]
# The protocol: messages, SCRAM-SHA-256(-PLUS) and the error fields, from the rust-postgres project.
# It brings sha2 0.11, hmac 0.13 and getrandom 0.4, the versions desk-core already builds.
postgres-protocol = "=0.6.12"
# The same project's driver, measured for what it cannot do (src/bin/driver.rs).
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "io-util", "time", "macros", "sync", "fs"] }
# The TLS stack desk-sys already uses: rustls 0.23 with ring.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
bytes = "1"
fallible-iterator = "0.2"
sha2 = "0.11"
serde_json = "1"
libc = "0.2"

[profile.release]
debug = false
