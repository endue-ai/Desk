<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>light</title>
<style>
  html, body { margin: 0; height: 100%; font: 28px/1.3 -apple-system, system-ui, sans-serif; color: #f5f5f7; }
  body { background: linear-gradient(135deg, #1d2b64, #f8cdda); display: grid; place-items: center; }
  .card { padding: 32px 40px; border-radius: 20px; background: rgba(0, 0, 0, 0.35); text-align: center; }
  .spin { width: 80px; height: 80px; margin: 16px auto; border-radius: 16px; background: #ffd166;
          animation: spin 2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  canvas { display: block; margin: 0 auto; border-radius: 12px; background: #0b132b; }
  small { opacity: 0.8; font-size: 18px; }
</style>
<div class="card">
  <div>Off-screen CEF surface · 데스크 합성기</div>
  <div class="spin"></div>
  <canvas id="c" width="360" height="120"></canvas>
  <small id="t">frame 0</small>
</div>
<script>
  const ctx = document.getElementById("c").getContext("2d");
  const label = document.getElementById("t");
  let n = 0;
  function tick(now) {
    n += 1;
    ctx.fillStyle = "#0b132b"; ctx.fillRect(0, 0, 360, 120);
    ctx.fillStyle = "#06d6a0";
    ctx.beginPath(); ctx.arc(60 + ((now / 5) % 240), 60, 26, 0, Math.PI * 2); ctx.fill();
    label.textContent = `${location.host} · frame ${n}`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  console.log(`SPIKE ready light ${location.host}`);
</script>
</html>
