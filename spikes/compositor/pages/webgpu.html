<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>webgpu</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 20px system-ui, sans-serif; }
  .row { display: flex; gap: 16px; padding: 16px; }
  figure { margin: 0; } figcaption { margin-top: 6px; }
  canvas { width: 360px; height: 360px; border-radius: 12px; background: #222; }
</style>
<div class="row">
  <figure><canvas id="gpu" width="720" height="720"></canvas><figcaption id="gpuText">WebGPU …</figcaption></figure>
  <figure><canvas id="gl" width="720" height="720"></canvas><figcaption id="glText">WebGL2 …</figcaption></figure>
</div>
<script type="module">
  const say = (line) => console.log(`SPIKE ${line}`);

  async function webgpu() {
    const caption = document.getElementById("gpuText");
    if (!navigator.gpu) { caption.textContent = "WebGPU: no navigator.gpu"; say("webgpu fail no-navigator-gpu"); return; }
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) { caption.textContent = "WebGPU: no adapter"; say("webgpu fail no-adapter"); return; }
    const device = await adapter.requestDevice();
    const info = adapter.info || {};
    const canvas = document.getElementById("gpu");
    const context = canvas.getContext("webgpu");
    const format = navigator.gpu.getPreferredCanvasFormat();
    context.configure({ device, format, alphaMode: "premultiplied" });
    const module = device.createShaderModule({ code: `
      struct U { angle: f32 };
      @group(0) @binding(0) var<uniform> u: U;
      struct V { @builtin(position) p: vec4f, @location(0) c: vec3f };
      @vertex fn vs(@builtin(vertex_index) i: u32) -> V {
        var pos = array<vec2f, 3>(vec2f(0.0, 0.8), vec2f(-0.7, -0.6), vec2f(0.7, -0.6));
        var col = array<vec3f, 3>(vec3f(1, 0.3, 0.3), vec3f(0.3, 1, 0.4), vec3f(0.3, 0.5, 1));
        let s = sin(u.angle); let c = cos(u.angle);
        let q = pos[i];
        var o: V; o.p = vec4f(q.x * c - q.y * s, q.x * s + q.y * c, 0, 1); o.c = col[i]; return o;
      }
      @fragment fn fs(v: V) -> @location(0) vec4f { return vec4f(v.c, 1); }` });
    const pipeline = device.createRenderPipeline({
      layout: "auto",
      vertex: { module, entryPoint: "vs" },
      fragment: { module, entryPoint: "fs", targets: [{ format }] },
      primitive: { topology: "triangle-list" },
    });
    const uniform = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const group = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: uniform } }] });
    let frames = 0;
    function frame(now) {
      device.queue.writeBuffer(uniform, 0, new Float32Array([now / 1000, 0, 0, 0]));
      const encoder = device.createCommandEncoder();
      const pass = encoder.beginRenderPass({ colorAttachments: [{ view: context.getCurrentTexture().createView(),
        clearValue: { r: 0.08, g: 0.08, b: 0.12, a: 1 }, loadOp: "clear", storeOp: "store" }] });
      pass.setPipeline(pipeline); pass.setBindGroup(0, group); pass.draw(3); pass.end();
      device.queue.submit([encoder.finish()]);
      frames += 1;
      if (frames === 120) say(`webgpu frames=120`);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    const text = `${info.vendor || "?"} / ${info.architecture || "?"} / ${info.description || info.device || "?"}`;
    caption.textContent = `WebGPU: ${text}`;
    say(`webgpu ok adapter=${text} fallback=${adapter.isFallbackAdapter === true} format=${format}`);
  }

  function webgl2() {
    const caption = document.getElementById("glText");
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl2");
    if (!gl) { caption.textContent = "WebGL2: none"; say("webgl2 fail no-context"); return; }
    const ext = gl.getExtension("WEBGL_debug_renderer_info");
    const renderer = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    const vs = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs, `#version 300 es
      uniform float a; in vec2 p; void main() { float s = sin(a), c = cos(a);
      gl_Position = vec4(p.x * c - p.y * s, p.x * s + p.y * c, 0, 1); }`);
    gl.compileShader(vs);
    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, `#version 300 es
      precision mediump float; out vec4 o; void main() { o = vec4(1.0, 0.8, 0.2, 1.0); }`);
    gl.compileShader(fs);
    const program = gl.createProgram();
    gl.attachShader(program, vs); gl.attachShader(program, fs); gl.linkProgram(program); gl.useProgram(program);
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0.8, -0.7, -0.6, 0.7, -0.6]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(program, "p");
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const angle = gl.getUniformLocation(program, "a");
    function frame(now) {
      gl.clearColor(0.1, 0.05, 0.15, 1); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1f(angle, -now / 1000); gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    caption.textContent = `WebGL2: ${renderer}`;
    say(`webgl2 ok renderer=${renderer}`);
  }

  webgl2();
  webgpu().catch((error) => say(`webgpu fail ${error}`));
  say(`ready webgpu ${location.host}`);
</script>
</html>
