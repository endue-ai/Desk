[workspace]
resolver = "3"
members = ["crates/*", "apps/desk/src-tauri"]
# The Tauri app needs the system webview SDKs to build, so day-to-day commands skip it.
# `just check-app` and the app-build CI job cover it.
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/endue-ai/Desk"
publish = false

[workspace.dependencies]
desk-bridge = { path = "crates/desk-bridge" }
desk-brain = { path = "crates/desk-brain" }
desk-brain-endue = { path = "crates/desk-brain-endue" }
desk-core = { path = "crates/desk-core" }
desk-sys = { path = "crates/desk-sys" }
base64 = "0.23"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.60", default-features = false }
wit-parser = { version = "0.262", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
