[workspace]
resolver = "3"
members = ["crates/*", "apps/desk/shell", "examples/plugin-native-wgpu"]
# The shell downloads and builds CEF, so day-to-day commands skip it; `just check-shell` covers it.
default-members = ["crates/*", "examples/plugin-native-wgpu"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/endue-ai/Desk"
publish = false

[workspace.dependencies]
desk-boot = { path = "crates/desk-boot" }
desk-bridge = { path = "crates/desk-bridge" }
desk-brain = { path = "crates/desk-brain" }
desk-brain-endue = { path = "crates/desk-brain-endue" }
desk-brain-local = { path = "crates/desk-brain-local" }
desk-core = { path = "crates/desk-core" }
desk-crash = { path = "crates/desk-crash" }
desk-index = { path = "crates/desk-index" }
desk-memory = { path = "crates/desk-memory" }
desk-plugin-host = { path = "crates/desk-plugin-host" }
desk-compositor = { path = "crates/desk-compositor" }
desk-surface = { path = "crates/desk-surface" }
desk-sys = { path = "crates/desk-sys" }
desk-trace = { path = "crates/desk-trace" }
desk-update = { path = "crates/desk-update" }
desk-web = { path = "crates/desk-web" }
desk-wm = { path = "crates/desk-wm" }
# The CEF shell (ADR 0143): pinned exactly, because CEF binaries and bindings move together.
cef = { version = "=156.4.0", default-features = false }
base64 = "0.23"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.60", default-features = false }
wit-parser = { version = "0.263", default-features = false, features = ["std"] }
yaml_serde = "0.10"
# bundled: SQLite is compiled in, with FTS5 and the JSON functions (desk-index, desk-memory).
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "functions"] }
# desk-compositor. wgpu stays on 30: the `cef` crate's accelerated_osr imports textures as wgpu 30 types.
wgpu = "30"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
png = "0.18"
# desk-compositor chrome text (ADR 0146): shaping, fallback and system fonts; the atlas packer.
cosmic-text = "0.19"
etagere = "0.3"
# Accessibility (#57): the desk's one tree in AccessKit's shape, its consumer to walk it in checks,
# and the winit adapter that speaks NSAccessibility, UI Automation and AT-SPI.
# serde: a role crosses the surface protocol by name (kebab-case there, camelCase in AccessKit's).
accesskit = { version = "0.25", features = ["serde"] }
accesskit_consumer = "0.39"
accesskit_winit = "0.34"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

# `just dev` runs the dev build, whose compositor, window manager and text layout lay the scene out
# every frame a window moves. Unoptimized, one layout of a 13-window desk took 3.4 to 3.7 ms (p50) of
# the main thread against 0.2 ms optimized (`apps/desk/shell/src/compositor_window/draw_cost_tests.rs`,
# 2026-11-13): the desk's crates build at opt-level 1 (0.23 to 0.29 ms) and their dependencies at 2,
# debug assertions and overflow checks still on. A rebuild after an edit took about 2 s either way;
# the dependencies' first build takes longer.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
