[package]
name = "desk-app"
description = "The endue Desk Tauri 2 shell: a thin adapter from the webview to desk-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "desk_app"

[[bin]]
name = "endue-desk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
desk-brain.workspace = true
desk-brain-endue.workspace = true
desk-brain-local.workspace = true
desk-bridge.workspace = true
desk-core.workspace = true
# Computer use (ADR 0120, ADR 0123): the OS driver the core serves computer.* through.
desk-computer = { path = "../../../crates/desk-computer" }
desk-crash.workspace = true
desk-index.workspace = true
desk-sys = { workspace = true, features = ["calendar"] }
desk-trace.workspace = true
desk-update = { workspace = true, features = ["https"] }
# Not in [workspace.dependencies] yet: a later chore moves it there.
desk-ipc = { path = "../../../crates/desk-ipc" }
desk-mcp-client = { path = "../../../crates/desk-mcp-client" }
serde.workspace = true
serde_json.workspace = true
# macos-private-api: the floating Eris window is transparent around her (ADR 0121).
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = { path = "../../../vendor/tauri-plugin-single-instance" }
# Installs a staged build on each OS (ADR 0054); desk-update decides which and when.
tauri-plugin-updater = "2.12"

# The floating Eris window joins full-screen Spaces and shows without taking the focus (ADR 0121).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }

[lints]
workspace = true
