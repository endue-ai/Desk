[package]
name = "desk-app"
description = "The endue Desk Tauri 2 shell: a thin adapter from the webview to desk-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "desk_app"

[[bin]]
name = "endue-desk"
path = "src/main.rs"

[features]
## Release builds: check for updates at start (ADR 0021). The release workflow turns this on together
## with the updater's public key and endpoint (plugins.updater in --config).
updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
desk-brain-endue.workspace = true
desk-bridge.workspace = true
desk-core.workspace = true
desk-sys = { workspace = true, features = ["microphone"] }
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", optional = true }

[lints]
workspace = true
