[package]
name = "desk-app"
description = "The endue Desk Tauri 2 shell: a thin adapter from the webview to desk-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "desk_app"

[[bin]]
name = "endue-desk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
desk-brain-endue.workspace = true
desk-bridge.workspace = true
desk-core.workspace = true
desk-index.workspace = true
desk-sys = { workspace = true, features = ["calendar"] }
desk-update = { workspace = true, features = ["https"] }
# Not in [workspace.dependencies] yet: a later chore moves it there.
desk-ipc = { path = "../../../crates/desk-ipc" }
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = { path = "../../../vendor/tauri-plugin-single-instance" }
# Installs a staged build on each OS (ADR 0054); desk-update decides which and when.
tauri-plugin-updater = "2.12"

[lints]
workspace = true
