<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="normal">
<style>
html, body { margin: 0; background: transparent; }
/* Rendered, so they take the focus, but never the pointer: a press goes to the plugin. */
[data-edge] { position: fixed; top: 0; left: 0; width: 1px; height: 1px; outline: none; pointer-events: none; }
</style>
</head>
<body>
<span tabindex="0" aria-hidden="true" data-edge="first"></span>
<span tabindex="-1" aria-hidden="true" data-edge="inside"></span>
<span tabindex="0" aria-hidden="true" data-edge="last"></span>
<script>
"use strict";
// Compositor mode (#52): this frame stands in for a plugin surface that renders in its own
// off-screen browser. What the runtime posts here goes to that browser; what the plugin posts to
// its parent comes back through here, so the runtime hears it from this frame as before.
//
// Tab (#123): the page's own focus navigation enters this frame at its first edge (Tab) or its last
// (Shift+Tab), as it entered a plugin's frame; the plugin's page then focuses its first or last
// control, and the focus here rests inside, where the window coming back to the front leaves it.
// When the plugin's page tabs past its end, the shell says so (`desk:stand-in-leave`): the focus
// goes to that edge, and the shell presses Tab in the page once more, which leaves this frame.
(() => {
  const native = globalThis.__deskNative;
  if (!native || typeof native.post !== "function") return;
  const edge = (name) => document.querySelector(`[data-edge="${name}"]`);
  let moving = false;
  const rest = (name) => {
    moving = true;
    edge(name)?.focus({ preventScroll: true });
    moving = false;
  };
  for (const name of ["first", "last"]) {
    edge(name)?.addEventListener("focus", () => {
      if (moving) return;
      native.post(JSON.stringify({ type: "desk:stand-in-enter", edge: name }));
      rest("inside");
    });
  }
  addEventListener("message", (event) => {
    if (event.source !== parent) return;
    let text;
    try {
      text = JSON.stringify(event.data);
    } catch {
      return;
    }
    if (typeof text === "string") native.post(text);
  });
  native.onMessage = (text) => {
    let data;
    try {
      data = JSON.parse(text);
    } catch {
      return;
    }
    // The plugin page's colour scheme is this frame's, so the backdrop under it is the frame's was.
    if (data?.type === "desk:stand-in-scheme") {
      if (typeof data.scheme === "string") document.documentElement.style.colorScheme = data.scheme;
      return;
    }
    // The plugin's page has no control past its end: only while this frame has the page's focus.
    if (data?.type === "desk:stand-in-leave") {
      if (!document.hasFocus()) return;
      const next = data.next === true;
      rest(next ? "last" : "first");
      native.post(JSON.stringify({ type: "desk:stand-in-tab", back: !next }));
      return;
    }
    parent.postMessage(data, "*");
  };
})();
</script>
</body>
</html>
