[package]
name = "desk-shell"
description = "The endue Desk shell on winit and CEF (ADR 0143); replaces the Tauri shell when Stage 1 of #32 ends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "desk_shell"

# Until the Tauri shell goes, the CEF one is endue-desk-cef so the two binaries never collide.
[[bin]]
name = "endue-desk-cef"
path = "src/main.rs"

# Every CEF subprocess on macOS (renderer, GPU, utility) starts here; on Linux and Windows the
# main binary is its own subprocess.
[[bin]]
name = "endue-desk-cef-helper"
path = "src/bin/helper.rs"

# Assembles the macOS .app: the CEF framework, the five helper apps and the shell's files.
[[bin]]
name = "desk-shell-bundle"
path = "src/bin/bundle.rs"
required-features = ["bundle"]

[features]
bundle = ["cef/build-util", "dep:semver"]

[package.metadata.cef.bundle]
helper_name = "endue-desk-cef-helper"

[dependencies]
cef.workspace = true
desk-boot.workspace = true
desk-bridge.workspace = true
# Computer use (ADR 0120, ADR 0123): the OS driver the core serves computer.* through.
desk-computer = { path = "../../../crates/desk-computer" }
# Compositor mode (#52): off-screen surfaces composited by desk-compositor over specs/surface.
desk-compositor.workspace = true
desk-surface.workspace = true
desk-core.workspace = true
desk-trace.workspace = true
# The desk's own updates (ADR 0054, ADR 0147): the updater, its HTTPS origin and the installer.
desk-update = { workspace = true, features = ["https", "install"] }
desk-web.workspace = true
getrandom = "0.3"
# The shell's services (#45): global shortcuts, the tray and the menus, the file dialog.
global-hotkey = "0.8"
http = "1"
png.workspace = true
pollster.workspace = true
raw-window-handle = "0.6"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
semver = { version = "1", optional = true }
serde.workspace = true
serde_json.workspace = true
tray-icon = "0.25"
url = "2.5"
winit = "0.30"
wgpu.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphics", "NSResponder", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSGeometry", "NSString", "NSURL", "NSValue"] }
# A paint's IOSurface, named by its IOSurfaceID in the surface protocol's attach (#52).
objc2-io-surface = { version = "0.3", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "objc2"] }

# Windows and Linux import CEF's shared textures with the `cef` crate's importer until the compositor
# imports D3D11 handles and DMA-BUFs itself (#61); macOS needs no importer of the engine's.
[target.'cfg(not(target_os = "macos"))'.dependencies]
cef = { workspace = true, features = ["accelerated_osr"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
