openapi: 3.1.0
info:
  title: Desk brain API
  version: 0.0.0
  summary: Sessions, streamed turns, tool round trips, session leases, and agents and spaces.
  description: >-
    The contract between Desk and a brain. The local brain adapter, endue AI and examples/brain-echo
    implement the same API. A session is written by exactly one Desk at a time: the holder of its lease.
    Opening the session on another Desk takes the lease over, and the previous holder becomes read-only.
  contact:
    name: Team endue
    email: team@endue.ai
    url: https://endue.ai
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: "http://localhost:{port}/v0"
    description: A local brain or examples/brain-echo. Cloud brains are configured by base URL.
    variables:
      port:
        default: "8787"
security:
  - bearerAuth: []
tags:
  - name: sessions
    description: Create and read sessions.
  - name: turns
    description: Send messages and receive streamed answers, including tool calls.
  - name: leases
    description: Decide which Desk may write to a session.
  - name: agents
    description: The person's agents, read through endue AI's API gateway.
  - name: spaces
    description: Spaces and the agents taking part in them, read through endue AI's API gateway.
paths:
  /sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a session
      description: Creates an empty session. The caller acquires a lease before sending turns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: The new session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
  /sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSession
      tags: [sessions]
      summary: Read a session
      description: Returns the session with its current lease, if any.
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
  /sessions/{sessionId}/turns:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: createTurn
      tags: [turns]
      summary: Send a message
      description: >-
        Sends one user message and streams the answer as Server-Sent Events. Each event's data is one
        TurnEvent as JSON. The stream ends after turn.completed or turn.error. A turn.completed with
        stopReason tool_call waits for submitToolResult.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnRequest"
      responses:
        "200":
          $ref: "#/components/responses/TurnStream"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LeaseConflict"
  /sessions/{sessionId}/turns/{turnId}/tool-results:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/TurnId"
    post:
      operationId: submitToolResult
      tags: [turns]
      summary: Return a tool result
      description: Sends the result of a tool.call event and streams the rest of the turn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolResultRequest"
      responses:
        "200":
          $ref: "#/components/responses/TurnStream"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LeaseConflict"
  /sessions/{sessionId}/lease:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getLease
      tags: [leases]
      summary: Read the current lease
      description: Returns the lease that is in force, or 404 when the session has none or it expired.
      responses:
        "200":
          description: The current lease.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: acquireLease
      tags: [leases]
      summary: Acquire the lease
      description: >-
        Acquires the session's lease for ttlSeconds. If another Desk holds it, the call fails with
        lease_held unless takeover is true; a takeover ends the other lease at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseAcquireRequest"
      responses:
        "200":
          description: The new lease.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LeaseConflict"
  /sessions/{sessionId}/lease/{leaseId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/LeaseId"
    put:
      operationId: renewLease
      tags: [leases]
      summary: Renew the lease
      description: >-
        Extends a lease the caller holds. Fails with lease_lost after a takeover and with lease_expired
        once expiresAt has passed; the caller is then read-only until it acquires again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseRenewRequest"
      responses:
        "200":
          description: The renewed lease.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        "409":
          $ref: "#/components/responses/LeaseConflict"
    delete:
      operationId: releaseLease
      tags: [leases]
      summary: Release the lease
      description: Gives the lease up so another Desk can acquire it without a takeover.
      responses:
        "204":
          description: Released.
        "409":
          $ref: "#/components/responses/LeaseConflict"
  /api/v1/agents:
    servers:
      - url: https://platform.endue.ai
        description: endue AI's API gateway.
      - url: "http://localhost:{port}"
        description: examples/brain-echo, which serves the gateway's paths at its root.
        variables:
          port:
            default: "8787"
    get:
      operationId: listAgents
      tags: [agents]
      summary: List agents
      description: >-
        The caller's agents, one page at a time: endue AI's API gateway route, answered by its agent
        service. Desk shows active and inactive agents and hides archived and deleted ones.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of agents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/spaces:
    servers:
      - url: https://platform.endue.ai
        description: endue AI's API gateway.
      - url: "http://localhost:{port}"
        description: examples/brain-echo, which serves the gateway's paths at its root.
        variables:
          port:
            default: "8787"
    get:
      operationId: listSpaces
      tags: [spaces]
      summary: List spaces
      description: The caller's active spaces, as endue AI's API gateway lists them (a plain array).
      responses:
        "200":
          description: Every active space.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/spaces/{spaceId}/agents:
    servers:
      - url: https://platform.endue.ai
        description: endue AI's API gateway.
      - url: "http://localhost:{port}"
        description: examples/brain-echo, which serves the gateway's paths at its root.
        variables:
          port:
            default: "8787"
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      operationId: listSpaceAgents
      tags: [spaces]
      summary: List a space's agents
      description: >-
        Which agents take part in a space. Switching spaces in Desk shows these agents; removed ones
        are left out.
      responses:
        "200":
          description: The space's agents, in the gateway's data and meta envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceAgentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An endue ID token for endue AI. Local brains may accept any token.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: The session id.
      schema:
        type: string
        minLength: 1
    TurnId:
      name: turnId
      in: path
      required: true
      description: The turn id from turn.started.
      schema:
        type: string
        minLength: 1
    LeaseId:
      name: leaseId
      in: path
      required: true
      description: The lease id from acquireLease.
      schema:
        type: string
        minLength: 1
    SpaceId:
      name: spaceId
      in: path
      required: true
      description: The space id.
      schema:
        type: string
        minLength: 1
    Page:
      name: page
      in: query
      required: false
      description: The page to read, from 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Items per page. The gateway answers at most 50, larger values are lowered.
      schema:
        type: integer
        minimum: 1
        default: 20
  responses:
    Unauthorized:
      description: No valid endue ID token. The gateway answers with its own error body.
      content:
        application/json:
          schema:
            type: object
    TurnStream:
      description: A stream of TurnEvent objects, one per SSE data line.
      content:
        text/event-stream:
          schema:
            $ref: "#/components/schemas/TurnEvent"
    BadRequest:
      description: The request does not match the schema.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BrainError"
    NotFound:
      description: No such session, turn, lease or space.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BrainError"
    LeaseConflict:
      description: The caller does not hold the lease (lease_held, lease_lost or lease_expired).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BrainError"
  schemas:
    Session:
      description: A conversation and its state.
      type: object
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string }
        status: { $ref: "#/components/schemas/SessionStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lease: { $ref: "#/components/schemas/Lease" }
      required: [id, status, createdAt, updatedAt]
      additionalProperties: false
    SessionStatus:
      description: Whether the session accepts turns.
      type: string
      enum: [active, closed]
    CreateSessionRequest:
      description: Body of createSession.
      type: object
      properties:
        title: { type: string }
        client: { $ref: "#/components/schemas/ClientInfo" }
      required: [client]
      additionalProperties: false
    ClientInfo:
      description: The Desk build that talks to the brain.
      type: object
      properties:
        name: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
      required: [name, version]
      additionalProperties: false
    TurnRequest:
      description: Body of createTurn. Only the lease holder may send turns.
      type: object
      properties:
        leaseId: { type: string, minLength: 1 }
        message: { $ref: "#/components/schemas/UserMessage" }
      required: [leaseId, message]
      additionalProperties: false
    UserMessage:
      description: What the person said or typed.
      type: object
      properties:
        role: { const: user }
        content:
          type: array
          items: { $ref: "#/components/schemas/TextPart" }
          minItems: 1
      required: [role, content]
      additionalProperties: false
    TextPart:
      description: A piece of text.
      type: object
      properties:
        type: { const: text }
        text: { type: string }
      required: [type, text]
      additionalProperties: false
    TurnEvent:
      description: One event in a turn stream.
      oneOf:
        - $ref: "#/components/schemas/TurnStartedEvent"
        - $ref: "#/components/schemas/TextDeltaEvent"
        - $ref: "#/components/schemas/ToolCallEvent"
        - $ref: "#/components/schemas/TurnCompletedEvent"
        - $ref: "#/components/schemas/TurnErrorEvent"
    TurnStartedEvent:
      description: The brain started answering.
      type: object
      properties:
        type: { const: turn.started }
        turnId: { type: string, minLength: 1 }
      required: [type, turnId]
      additionalProperties: false
    TextDeltaEvent:
      description: More answer text, to be appended.
      type: object
      properties:
        type: { const: text.delta }
        turnId: { type: string, minLength: 1 }
        text: { type: string }
      required: [type, turnId, text]
      additionalProperties: false
    ToolCallEvent:
      description: The brain wants Desk to run a tool and send the result with submitToolResult.
      type: object
      properties:
        type: { const: tool.call }
        turnId: { type: string, minLength: 1 }
        call: { $ref: "#/components/schemas/ToolCall" }
      required: [type, turnId, call]
      additionalProperties: false
    ToolCall:
      description: One tool invocation.
      type: object
      properties:
        callId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        arguments:
          description: Tool arguments as a JSON object.
          type: object
      required: [callId, name, arguments]
      additionalProperties: false
    TurnCompletedEvent:
      description: The turn ended.
      type: object
      properties:
        type: { const: turn.completed }
        turnId: { type: string, minLength: 1 }
        stopReason: { $ref: "#/components/schemas/StopReason" }
      required: [type, turnId, stopReason]
      additionalProperties: false
    StopReason:
      description: Why the turn ended. tool_call means it continues after submitToolResult.
      type: string
      enum: [end_turn, tool_call, max_tokens, cancelled]
    TurnErrorEvent:
      description: The turn failed.
      type: object
      properties:
        type: { const: turn.error }
        turnId: { type: string, minLength: 1 }
        error: { $ref: "#/components/schemas/BrainError" }
      required: [type, error]
      additionalProperties: false
    ToolResultRequest:
      description: Body of submitToolResult.
      type: object
      properties:
        leaseId: { type: string, minLength: 1 }
        callId: { type: string, minLength: 1 }
        output:
          description: The tool's output as any JSON value.
        isError: { type: boolean }
      required: [leaseId, callId, output]
      additionalProperties: false
    Lease:
      description: The right to write to a session until expiresAt.
      type: object
      properties:
        leaseId: { type: string, minLength: 1 }
        sessionId: { type: string, minLength: 1 }
        holder: { $ref: "#/components/schemas/LeaseHolder" }
        acquiredAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        ttlSeconds: { type: integer, minimum: 5, maximum: 3600 }
      required: [leaseId, sessionId, holder, acquiredAt, expiresAt, ttlSeconds]
      additionalProperties: false
    LeaseHolder:
      description: The Desk that holds a lease.
      type: object
      properties:
        deskId: { type: string, minLength: 1 }
        name: { type: string }
      required: [deskId]
      additionalProperties: false
    LeaseAcquireRequest:
      description: Body of acquireLease.
      type: object
      properties:
        holder: { $ref: "#/components/schemas/LeaseHolder" }
        ttlSeconds: { type: integer, minimum: 5, maximum: 3600 }
        takeover: { type: boolean }
      required: [holder, ttlSeconds]
      additionalProperties: false
    LeaseRenewRequest:
      description: Body of renewLease. Without ttlSeconds the lease keeps its ttl.
      type: object
      properties:
        ttlSeconds: { type: integer, minimum: 5, maximum: 3600 }
      additionalProperties: false
    BrainError:
      description: Why a call failed. lease_held carries the current holder.
      type: object
      properties:
        code: { $ref: "#/components/schemas/BrainErrorCode" }
        message: { type: string }
        holder: { $ref: "#/components/schemas/LeaseHolder" }
      required: [code, message]
      additionalProperties: false
    AgentStatus:
      description: Whether an agent takes work. Desk shows inactive agents waiting at the edge.
      type: string
      enum: [active, inactive, archived, deleted]
    Agent:
      description: >-
        One agent as endue AI's API gateway lists it (agent service AgentGetResponse), names as they
        are on the wire. The gateway may add fields; clients ignore what they do not know.
      type: object
      properties:
        id: { type: string, minLength: 1 }
        slug:
          description: A handle made from the name when the agent was created; it never changes.
          type: string
          minLength: 1
        name: { type: string, minLength: 1 }
        status: { $ref: "#/components/schemas/AgentStatus" }
        region:
          description: ISO 3166-2 region the agent runs in.
          type: string
        personal_color:
          description: The agent's own colour as hex. Desk paints only with its tokens.
          type: string
        avatar_url: { type: string }
        description: { type: string }
        live_enabled:
          description: Whether the agent is public on endue.live.
          type: boolean
        source_catalog: { $ref: "#/components/schemas/SourceCatalog" }
        pinned_at:
          description: When the person pinned the agent; null when not pinned, absent when unknown.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, slug, name, status, created_at, updated_at]
    SourceCatalog:
      description: The catalog agent this agent was made from.
      type: object
      properties:
        catalog_agent_id: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
      required: [catalog_agent_id, version]
    Pagination:
      description: Where a page sits in the whole list.
      type: object
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        has_next_page: { type: boolean }
      required: [total, page, limit, has_next_page]
    AgentList:
      description: One page of listAgents.
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Agent" }
        pagination: { $ref: "#/components/schemas/Pagination" }
      required: [items, pagination]
    SpaceType:
      description: A chat space or a workspace.
      type: string
      enum: [chat, workspace]
    Space:
      description: One space as endue AI's API gateway lists it (space service SpaceGetResponse).
      type: object
      properties:
        id: { type: string, minLength: 1 }
        key:
          description: Short unique handle.
          type: string
          minLength: 1
        name: { type: string, minLength: 1 }
        description: { type: string }
        type: { $ref: "#/components/schemas/SpaceType" }
        goal: { type: string }
        status: { $ref: "#/components/schemas/SpaceStatus" }
        front_agent_id:
          description: The agent that answers the person in this space.
          type: string
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, key, name, type, created_at, updated_at]
    SpaceStatus:
      description: Whether a space is in use.
      type: string
      enum: [active, archived, deleted]
    SpaceList:
      description: The answer of listSpaces, a plain array.
      type: array
      items: { $ref: "#/components/schemas/Space" }
    SpaceAgentStatus:
      description: Whether an agent still takes part in the space.
      type: string
      enum: [active, removed]
    SpaceAgent:
      description: An agent's part in a space (space service SpaceAgentView).
      type: object
      properties:
        id: { type: string, minLength: 1 }
        space_id: { type: string, minLength: 1 }
        agent_id: { type: string, minLength: 1 }
        role_key:
          description: generalist, analyst, writer, reviewer or the person's own.
          type: string
        is_front:
          description: Whether this agent answers the person in the space (one per space).
          type: boolean
        permission:
          description: admin or participant.
          type: string
        status: { $ref: "#/components/schemas/SpaceAgentStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, space_id, agent_id, is_front, status, created_at, updated_at]
    ResponseMeta:
      description: The gateway envelope's request details.
      type: object
      properties:
        request_id: { type: string }
        timestamp: { type: string, format: date-time }
        duration: { type: number }
      required: [request_id, timestamp]
    SpaceAgentList:
      description: The answer of listSpaceAgents, in the gateway's data and meta envelope.
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/SpaceAgent" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
      required: [data, meta]
    BrainErrorCode:
      description: Machine-readable failure reason.
      type: string
      enum:
        - invalid_request
        - unauthorized
        - not_found
        - lease_held
        - lease_lost
        - lease_expired
        - rate_limited
        - internal
