[package]
name = "plugin-hello-connector"
description = "The smallest connector: the markdown files in a folder, as note items."
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "hello_connector"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Its own workspace: the repository's workspace builds for the desk, this one for Wasm.
[workspace]
