# cargo-deny: licences, advisories, bans and sources for the Rust workspace.
# Run locally with `cargo deny check` (CI: .github/workflows/security.yml).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained, not vulnerable. Pulled in by glib-macros and gtk3-macros, the Linux GTK stack under
  # the shell's tray, menus and file dialog (tray-icon, muda, rfd). Remove when they move off gtk3-rs.
  { id = "RUSTSEC-2024-0370", reason = "transitive via the shell's Linux GTK stack; no maintained alternative yet" },
  # Unmaintained, not vulnerable: merged into zbus 6. Pulled in by accesskit_unix (AT-SPI, the
  # compositor window's accessibility on Linux, #57), which is still on zbus 5. Remove when it moves.
  { id = "RUSTSEC-2026-0370", reason = "zvariant, transitive via accesskit_unix on zbus 5; no release on zbus 6 yet" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names, transitive via accesskit_unix on zbus 5; no release on zbus 6 yet" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, transitive via accesskit_unix on zbus 5; no release on zbus 6 yet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences, plus MPL-2.0 (file-level copyleft: option-ext, under dirs).
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
