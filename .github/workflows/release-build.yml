name: release-build

# Builds one version for the four targets (ADR 0054), called by canary, release and release-final
# (which builds a candidate's commit again, given as ref; ADR 0090). No macOS
# universal build: darwin-aarch64 and darwin-x86_64 ship apart. Updater artifacts are signed with
# the updater key, the version in each signature; the public key and the commit go into the binary.
# macOS is signed and notarised when the Apple secrets are set; Windows ships NSIS only, unsigned
# until the certificate is chosen. Linux builds
# an AppImage and a .deb, and an .rpm for releases only (RPM takes no hyphen in a version). The .deb
# is checked against the updater key before it leaves. Each target leaves as the artifact
# desk-<target>, canonical names from scripts/release-collect.mjs. A dry run (release-dry-run.yml)
# stays out of the signing environment, signs with the run's throwaway key, embeds no key in the
# binary and labels its artifacts desk-<target>-unsigned.
on:
  workflow_call:
    inputs:
      version:
        description: The version to build, without a leading v.
        required: true
        type: string
      ref:
        description: The commit to build (empty for the commit that started the run).
        required: false
        type: string
        default: ""
      dry-run:
        description: Sign with the run's throwaway key (artifact dry-run-key) and stay out of signing.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    # An empty name is no environment: a dry run reads no secret and runs on any branch.
    environment: ${{ !inputs.dry-run && 'signing' || '' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-aarch64
            os: macos-latest
            rust: aarch64-apple-darwin
            bundles: app,dmg
          - target: darwin-x86_64
            os: macos-latest
            rust: x86_64-apple-darwin
            bundles: app,dmg
          - target: windows-x86_64
            os: windows-latest
            rust: x86_64-pc-windows-msvc
            bundles: nsis
          - target: linux-x86_64
            os: ubuntu-22.04
            rust: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain (rust-toolchain.toml) and the target
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.rust }}"
      # A signed build reads the cache and never writes it: what it signs leans on no cache it made.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.rust }}
          save-if: ${{ inputs.dry-run }}
      - name: Configure Ubuntu package downloads
        if: runner.os == 'Linux'
        run: sudo "$(command -v node)" scripts/ci-apt.mjs
      - name: Install the WebKitGTK SDK and the AppImage tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        if: ${{ inputs.dry-run }}
        with:
          name: dry-run-key
          path: ${{ runner.temp }}/dry-run-key
      - name: Take the run's throwaway key
        if: ${{ inputs.dry-run }}
        env:
          KEY_DIR: ${{ runner.temp }}/dry-run-key
        # It signs this run's artifacts only; the build step takes it instead of the secrets.
        run: |
          {
            echo "DRY_RUN_KEY<<DESK_KEY_END"; cat "$KEY_DIR/updater.key"; echo; echo "DESK_KEY_END"
            echo "DRY_RUN_PUBKEY=$(cat "$KEY_DIR/updater.key.pub")"
          } >> "$GITHUB_ENV"
      - name: Sign and notarise on macOS when the Apple secrets are set
        if: runner.os == 'macOS' && !inputs.dry-run
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Tauri signs as soon as these are set, even to "", so only set ones reach the build. It
        # notarises with an App Store Connect API key when one is set (no person's Apple ID or
        # two-factor prompt behind it), else with the Apple ID and its app password.
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::notice::No Apple signing secrets: the macOS build is neither signed nor notarised"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [ -n "${!name}" ]; then echo "$name=${!name}" >> "$GITHUB_ENV"; fi
          done
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ]; then
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
            { echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"; echo "APPLE_API_KEY=$APPLE_API_KEY"; echo "APPLE_API_KEY_PATH=$key"; } >> "$GITHUB_ENV"
          else
            for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!name}" ]; then echo "$name=${!name}" >> "$GITHUB_ENV"; fi
            done
          fi
      - name: Build ${{ matrix.target }} ${{ inputs.version }}
        # A dry run signs with the run's key and embeds none (empty is none), so its binary never
        # updates itself.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.dry-run && env.DRY_RUN_KEY || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.dry-run && 'dry-run' || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ inputs.dry-run && env.DRY_RUN_PUBKEY || vars.DESK_UPDATER_PUBKEY }}
          DESK_UPDATER_PUBKEY: ${{ !inputs.dry-run && vars.DESK_UPDATER_PUBKEY || '' }}
          DESK_UPDATE_URL: ${{ vars.DESK_RELEASES_URL || 'https://releases.endue.ai/desk' }}
          DESK_BUILD_COMMIT: ${{ inputs.ref || github.sha }}
        # createUpdaterArtifacts reads the public key from plugins.updater.pubkey and refuses an empty
        # one; the plugin's own config needs it too.
        run: |
          config="$(printf '{"version":"%s","bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s"}}}' "$VERSION" "$UPDATER_PUBKEY")"
          # RPM refuses a hyphen in the version: pre-releases (canary, beta) build no .rpm, and
          # desks installed from one follow stable.
          bundles="${{ matrix.bundles }}"
          if [[ "$VERSION" == *-* ]]; then bundles="${bundles/,rpm/}"; fi
          pnpm --filter @endue-ai/desk-app tauri build \
            --target "${{ matrix.rust }}" --bundles "$bundles" --config "$config"
      - name: Collect the bundles under canonical names
        run: |
          node scripts/release-collect.mjs --bundle "target/${{ matrix.rust }}/release/bundle" \
            --version "$VERSION" --target "${{ matrix.target }}" --out dist
      - name: Check the .deb against the updater key
        if: runner.os == 'Linux'
        env:
          UPDATER_PUBKEY: ${{ inputs.dry-run && env.DRY_RUN_PUBKEY || vars.DESK_UPDATER_PUBKEY }}
        run: e2e/smoke/verify-signature.sh "dist/endue-desk_${VERSION}_linux-x86_64.deb" "$UPDATER_PUBKEY"
      - uses: actions/upload-artifact@v7
        with:
          name: desk-${{ matrix.target }}${{ inputs.dry-run && '-unsigned' || '' }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
