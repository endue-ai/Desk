name: release-build

# Builds one version for the four targets (ADR 0054), called by canary, release and release-final
# (which builds a candidate's commit again, given as ref; ADR 0092). No macOS
# universal build: darwin-aarch64 and darwin-x86_64 ship apart. Updater artifacts are signed with
# the updater key, the version in each signature; the public key and the commit go into the binary.
# endue uses the CEF shell (#46, #97, ADR 0145). The build verifies the pinned CEF download and
# produces cargo-packager's .app (helpers signed one by one) and .dmg, NSIS and MSI, .deb
# and AppImage, the updater artifacts signed as Tauri's were, the install smoke run on every package.
# macOS is signed and notarised when the Apple secrets are set; Windows is signed when
# DESK_WINDOWS_SIGN_COMMAND is set. The .deb is checked against the updater key before it leaves.
# Each target uploads endue-app-<target> with package names from scripts/release-collect.mjs.
# A dry run (release-dry-run.yml) stays out of the signing environment, signs with the run's
# throwaway key, embeds no key in the binary and labels its artifacts endue-app-<target>-unsigned.
# release-macos.yml asks for both macOS targets. Without an updater key it requests only the
# first-install disk images.
on:
  workflow_call:
    inputs:
      version:
        description: The version to build, without a leading v.
        required: true
        type: string
      shell:
        description: The endue shell to build (cef). A release line selects its shell in .github/release-shell.
        required: false
        type: string
        default: cef
      ref:
        description: The commit to build (empty for the commit that started the run).
        required: false
        type: string
        default: ""
      targets:
        description: all four targets, or darwin for the two macOS ones.
        required: false
        type: string
        default: all
      installers-only:
        description: Collect the first-install images only (the .dmg), with no updater signature.
        required: false
        type: boolean
        default: false
      dry-run:
        description: Sign with the run's throwaway key (artifact dry-run-key) and stay out of signing.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    # An empty name is no environment: a dry run reads no secret and runs on any branch.
    environment: ${{ !inputs.dry-run && 'signing' || '' }}
    strategy:
      fail-fast: true
      matrix:
        # Each row is a target, its runner and its Rust triple: the two macOS rows for targets:
        # darwin, else all four (scripts/ci-release-macos.test.mjs holds the two lists together).
        include: >-
          ${{ fromJSON(inputs.targets == 'darwin'
          && '[{"target":"darwin-aarch64","os":"macos-latest","rust":"aarch64-apple-darwin"},{"target":"darwin-x86_64","os":"macos-latest","rust":"x86_64-apple-darwin"}]'
          || '[{"target":"darwin-aarch64","os":"macos-latest","rust":"aarch64-apple-darwin"},{"target":"darwin-x86_64","os":"macos-latest","rust":"x86_64-apple-darwin"},{"target":"windows-x86_64","os":"windows-latest","rust":"x86_64-pc-windows-msvc"},{"target":"linux-x86_64","os":"ubuntu-22.04","rust":"x86_64-unknown-linux-gnu"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the requested endue shell
        if: inputs.shell != 'cef'
        env:
          SHELL_NAME: ${{ inputs.shell }}
        run: |
          echo "::error::Unsupported shell '$SHELL_NAME'. Set shell to cef to build endue."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain (rust-toolchain.toml) and the target
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.rust }}"
      # A signed build reads the cache and never writes it: what it signs leans on no cache it made.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.rust }}
          save-if: ${{ inputs.dry-run }}
      - name: Configure Ubuntu package downloads
        if: runner.os == 'Linux'
        run: sudo "$(command -v node)" scripts/ci-apt.mjs
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.dry-run }}
        with:
          name: dry-run-key
          path: ${{ runner.temp }}/dry-run-key
      - name: Take the run's throwaway key
        if: ${{ inputs.dry-run }}
        env:
          KEY_DIR: ${{ runner.temp }}/dry-run-key
        # It signs this run's artifacts only; the build step takes it instead of the secrets.
        run: |
          {
            echo "DRY_RUN_KEY<<DESK_KEY_END"; cat "$KEY_DIR/updater.key"; echo; echo "DESK_KEY_END"
            echo "DRY_RUN_PUBKEY=$(cat "$KEY_DIR/updater.key.pub")"
          } >> "$GITHUB_ENV"
      - name: Install CEF build tools for endue
        if: inputs.shell == 'cef' && runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install cmake ninja; exit 0; fi
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev libfuse2 file xvfb
      # The archive only, keyed by its pin: every run checks its hashes and unpacks it afresh.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: inputs.shell == 'cef'
        with:
          path: ${{ runner.temp }}/cef/*/*.tar.bz2
          key: cef-${{ matrix.rust }}-${{ hashFiles('apps/desk/shell/packager/cef.json') }}
      - name: Fetch the pinned CEF
        if: inputs.shell == 'cef'
        run: echo "CEF_PATH=$(node scripts/cef-fetch.mjs --target "${{ matrix.rust }}" --out "$RUNNER_TEMP/cef")" >> "$GITHUB_ENV"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: inputs.shell == 'cef' && inputs.dry-run
        with:
          path: ${{ runner.temp }}/cef/*/*.tar.bz2
          key: cef-${{ matrix.rust }}-${{ hashFiles('apps/desk/shell/packager/cef.json') }}
      - name: Build endue ${{ inputs.version }} for ${{ matrix.target }}
        if: inputs.shell == 'cef'
        # A dry run embeds no updater key (empty is none), so its binary never updates itself.
        env:
          # On Linux, endue loads libcef.so from its installation directory.
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-Wl,-rpath,$ORIGIN' || '' }}
          DESK_UPDATER_PUBKEY: ${{ !inputs.dry-run && vars.ENDUE_UPDATER_PUBLIC_KEY || '' }}
          DESK_BUILD_COMMIT: ${{ inputs.ref || github.sha }}
          DESK_VERSION: ${{ inputs.version }}
        run: |
          pnpm --filter @endue-ai/plugin-sdk --filter @endue-ai/ui build
          pnpm --filter @endue-ai/desk-app build
          if [ -f scripts/package-build-env.sh ]; then source scripts/package-build-env.sh; fi
          cargo build -p desk-shell --bins --release --target "${{ matrix.rust }}"
          if [ "$RUNNER_OS" = Linux ] && [ -f scripts/package-cli-build-env.sh ]; then
            source scripts/package-cli-build-env.sh
          fi
          cargo build -p desk-cli --bins --release --target "${{ matrix.rust }}"
      - name: Install cargo-packager
        if: inputs.shell == 'cef'
        run: cargo install cargo-packager --version 0.11.8 --locked
      # The Apple secrets reach this step only: not pnpm, the crates' build scripts or the
      # cargo-packager install above. On macOS outside a dry run it exports the ones that are set
      # (scripts/cef-sign-macos.sh signs ad-hoc without an identity) and notarises with an App Store
      # Connect API key when one is set (no person's Apple ID or two-factor prompt behind it), else
      # with the Apple ID and its app password. The key file lives for this step only.
      - name: Package, sign and notarise endue with cargo-packager
        if: inputs.shell == 'cef'
        env:
          DESK_WINDOWS_SIGN_COMMAND: ${{ !inputs.dry-run && vars.DESK_WINDOWS_SIGN_COMMAND || '' }}
          IN_APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && !inputs.dry-run && secrets.APPLE_CERTIFICATE || '' }}
          IN_APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && !inputs.dry-run && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          IN_APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && !inputs.dry-run && secrets.APPLE_SIGNING_IDENTITY || '' }}
          IN_APPLE_API_ISSUER: ${{ runner.os == 'macOS' && !inputs.dry-run && secrets.APPLE_API_ISSUER || '' }}
          IN_APPLE_API_KEY: ${{ runner.os == 'macOS' && !inputs.dry-run && secrets.APPLE_API_KEY || '' }}
          IN_APPLE_API_KEY_P8: ${{ runner.os == 'macOS' && !inputs.dry-run && secrets.APPLE_API_KEY_P8 || '' }}
          IN_APPLE_ID: ${{ runner.os == 'macOS' && !inputs.dry-run && secrets.APPLE_ID || '' }}
          IN_APPLE_PASSWORD: ${{ runner.os == 'macOS' && !inputs.dry-run && secrets.APPLE_PASSWORD || '' }}
          IN_APPLE_TEAM_ID: ${{ runner.os == 'macOS' && !inputs.dry-run && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            if [ -n "$IN_APPLE_CERTIFICATE" ] && [ -n "$IN_APPLE_SIGNING_IDENTITY" ]; then
              for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
                value="IN_$name"
                if [ -n "${!value}" ]; then export "$name=${!value}"; fi
              done
              if [ -n "$IN_APPLE_API_KEY_P8" ] && [ -n "$IN_APPLE_API_KEY" ] && [ -n "$IN_APPLE_API_ISSUER" ]; then
                APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$IN_APPLE_API_KEY.p8"
                trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
                (umask 077; printf '%s\n' "$IN_APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH")
                export APPLE_API_ISSUER="$IN_APPLE_API_ISSUER" APPLE_API_KEY="$IN_APPLE_API_KEY" APPLE_API_KEY_PATH
              else
                for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                  value="IN_$name"
                  if [ -n "${!value}" ]; then export "$name=${!value}"; fi
                done
              fi
              # With the Apple identity the .app and the .dmg must come out notarised.
              export DESK_REQUIRE_NOTARISATION=1
            else
              echo "::notice::No Apple signing secrets: the macOS build is neither signed nor notarised"
            fi
          fi
          unset IN_APPLE_CERTIFICATE IN_APPLE_CERTIFICATE_PASSWORD IN_APPLE_SIGNING_IDENTITY IN_APPLE_API_ISSUER \
            IN_APPLE_API_KEY IN_APPLE_API_KEY_P8 IN_APPLE_ID IN_APPLE_PASSWORD IN_APPLE_TEAM_ID
          node scripts/cef-package.mjs --target "${{ matrix.rust }}" --version "$VERSION" --out target/packager
      - name: Sign the endue app updates
        if: inputs.shell == 'cef' && !inputs.installers-only
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.dry-run && env.DRY_RUN_KEY || secrets.ENDUE_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.dry-run && 'dry-run' || secrets.ENDUE_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          for file in target/packager/bundle/{macos,nsis,msi,appimage,deb}/*; do
            pnpm --filter @endue-ai/desk-app exec tauri signer sign --app-version "$VERSION" "$PWD/$file"
          done
      - name: Test installation of each endue app package
        if: inputs.shell == 'cef'
        env:
          # Installers only: nothing carries an updater signature, so none is checked (empty is none).
          DESK_UPDATER_PUBKEY: ${{ !inputs.installers-only && (inputs.dry-run && env.DRY_RUN_PUBKEY || vars.ENDUE_UPDATER_PUBLIC_KEY) || '' }}
          WINDOWS_SIGNED: ${{ !inputs.dry-run && vars.DESK_WINDOWS_SIGN_COMMAND || '' }}
          # Whether the packaging step signed with the Developer ID, without the secrets themselves.
          APPLE_SIGNED: ${{ runner.os == 'macOS' && !inputs.dry-run && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          shopt -s nullglob
          if [ "$APPLE_SIGNED" = true ] || [ -n "$WINDOWS_SIGNED" ]; then export DESK_REQUIRE_SIGNED=1; fi
          display() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a --server-args="-screen 0 1280x800x24" "$@"; else "$@"; fi; }
          for package in target/packager/bundle/*/*; do
            if [[ "$package" == *.sig ]]; then continue; fi
            display e2e/smoke/install-and-launch.sh "$package"
          done
      - name: Collect the endue app packages under their release names
        if: inputs.shell == 'cef'
        env:
          INSTALLERS_ONLY: ${{ inputs.installers-only }}
        run: |
          args=(--bundle target/packager/bundle --version "$VERSION" --target "${{ matrix.target }}" --out dist --shell cef)
          if [ "$INSTALLERS_ONLY" = true ]; then args+=(--installers); fi
          node scripts/release-collect.mjs "${args[@]}"
      - name: Package the same Linux CLI that shipped in the app
        if: runner.os == 'Linux' && !inputs.installers-only && hashFiles('scripts/package-cli.py') != ''
        run: |
          python3 -B scripts/package-cli-licenses/test_archive.py
          python3 -B scripts/package-cli.py "target/${{ matrix.rust }}/release/endue" "$VERSION" --out dist
      - name: Sign the standalone CLI
        if: runner.os == 'Linux' && !inputs.installers-only && hashFiles('scripts/package-cli.py') != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.dry-run && env.DRY_RUN_KEY || secrets.ENDUE_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.dry-run && 'dry-run' || secrets.ENDUE_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @endue-ai/desk-app exec tauri signer sign --app-version "$VERSION" "$PWD/dist/endue-cli_${VERSION}_linux-x86_64.tar.gz"
      - name: Download and install the signed CLI on minimal Debian
        if: runner.os == 'Linux' && !inputs.installers-only && hashFiles('scripts/package-cli.py') != ''
        env:
          DESK_UPDATER_PUBKEY: ${{ inputs.dry-run && env.DRY_RUN_PUBKEY || vars.ENDUE_UPDATER_PUBLIC_KEY }}
        run: e2e/smoke/cli-install-ci.sh dist "$VERSION"
      - name: Check the .deb against the updater key
        if: runner.os == 'Linux'
        env:
          UPDATER_PUBKEY: ${{ inputs.dry-run && env.DRY_RUN_PUBKEY || vars.ENDUE_UPDATER_PUBLIC_KEY }}
        run: e2e/smoke/verify-signature.sh dist/*_"${VERSION}"_linux-x86_64.deb "$UPDATER_PUBKEY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: endue-app-${{ matrix.target }}${{ inputs.dry-run && '-unsigned' || '' }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
