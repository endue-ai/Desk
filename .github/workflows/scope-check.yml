name: scope-check

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: scope-check-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  scope-check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the selected pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: node scripts/manual-pr.mjs --scope-event
      - name: Check out the trusted base version of the scope checker
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the changed files against the issue scope and the PR table
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: GITHUB_EVENT_PATH="$RUNNER_TEMP/scope-pr.json" node scripts/scope-check.mjs
