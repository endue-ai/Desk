name: scope-check

# Scope is judged on the pull request. In the merge queue (ADR 0015) the same required check only
# reports success: the queue re-tests integration, not the PR's Scope.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: scope-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope-check:
    name: scope-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Queued PRs passed scope-check as pull requests
        if: github.event_name == 'merge_group'
        run: echo "scope-check passed on every pull request in this merge group."

      # Check out the base commit so a PR cannot change the gate that judges it.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: github.event_name == 'pull_request'
        with:
          node-version: 22

      - name: Check changed files against the issue Scope and the As-is/To-be table
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          script=scripts/scope-check.mjs
          if [ ! -f "$script" ]; then
            # Bootstrapping: the PR that introduces the gate brings the first version of it.
            git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"
            script="$RUNNER_TEMP/scope-check.mjs"
            git show "$HEAD:scripts/scope-check.mjs" > "$script"
          fi
          node "$script"
