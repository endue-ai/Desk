name: scope-check

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: scope-check-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  scope-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve the selected PR and its trusted base
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Enter a positive PR number."; exit 1; }
          event="$RUNNER_TEMP/scope-pr.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq '{pull_request: {number, body, user: {login: .user.login}, state, base_ref: .base.ref, head: .head.sha}}' > "$event"
          base_ref="$(jq -er --arg ref "$GITHUB_REF" --arg default "refs/heads/$DEFAULT_BRANCH" --arg sha "$GITHUB_SHA" '
            .pull_request | select(.state == "open" and ($ref == $default or .head == $sha))
            | .base_ref | select(type == "string" and length > 0)' "$event")" || {
            echo "::error::Select the default branch or the current head of the open PR."
            exit 1
          }
          path="$(jq -nr --arg name "$base_ref" '$name | split("/") | map(@uri) | join("/")')"
          base="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$path" | jq -er --arg ref "refs/heads/$base_ref" '
            select(.ref == $ref and .object.type == "commit") | .object.sha | select(test("^[0-9a-f]{40}$"))')"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Check out the trusted base version of the scope checker
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the changed files against the issue scope and the PR table
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: GITHUB_EVENT_PATH="$RUNNER_TEMP/scope-pr.json" node scripts/scope-check.mjs
