name: e2e

# App e2e and the install smoke. `app-e2e` drives the CEF desk's debug build through chromedriver on
# its remote debugging port on three OSes (ADR 0144; Linux under Xvfb). The perf job measures its
# start-up, idle memory and input latency, nightly and on demand only. Not a required check: `ci`
# stays the required aggregate, and a path-filtered workflow cannot be required (ADR 0015). No
# Playwright here (ADR 0018).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "e2e/**"
      - "apps/desk/**"
      - "crates/desk-sys/**"
      - "crates/desk-boot/**"
      - "crates/desk-web/**"
      - "plugins/**"
      - ".github/workflows/e2e.yml"
      - "scripts/ci-apt.mjs"
      - "scripts/ci-apt.test.mjs"
  schedule:
    - cron: "41 17 * * *" # 02:41 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app-e2e:
    name: app-e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Configure Ubuntu package downloads
        if: runner.os == 'Linux'
        run: sudo "$(command -v node)" scripts/ci-apt.mjs
      - name: Install cmake, ninja and Xvfb
        if: runner.os == 'Linux'
        # The image's Google Chrome brings the libraries CEF loads (NSS, ATK, GBM, ...).
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build xvfb
      - name: Install cmake and ninja
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - run: pnpm install --frozen-lockfile
      - run: just build-shell
      - name: App e2e
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a --server-args="-screen 0 1280x800x24" just test-app-e2e' || 'just test-app-e2e' }}
      - name: Install smoke
        # Reports even when a spec failed; skipped only when the run was cancelled.
        if: ${{ !cancelled() }}
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a --server-args="-screen 0 1280x800x24" just smoke' || 'just smoke' }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-results-${{ runner.os }}
          path: e2e/test-results
          retention-days: 7

  perf:
    # Start-up, idle memory and input latency on the CEF desk (`just perf-app`, e2e/perf): nightly
    # and on demand, never on pull requests. It fails past a baseline's allowance in
    # e2e/perf/budgets.json; until this runner's baseline is committed it reports without failing and
    # leaves a budgets.json holding this run's values in its artifact.
    name: perf
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Configure Ubuntu package downloads
        run: sudo "$(command -v node)" scripts/ci-apt.mjs
      - name: Install cmake, ninja and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build xvfb
      - run: pnpm install --frozen-lockfile
      - run: just build-shell
      - name: Start-up, idle memory and input latency
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" just perf-app
      - name: Upload results.json and the start-up traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: e2e/test-results/perf
          retention-days: 30
