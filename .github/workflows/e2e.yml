name: e2e

# Manually run the three-OS CEF suite, installer smoke and Linux performance measurements.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app-e2e:
    name: app-e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Configure Ubuntu package downloads
        if: runner.os == 'Linux'
        run: sudo "$(command -v node)" scripts/ci-apt.mjs
      - name: Install the Linux shell build dependencies and Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev xvfb
      - name: Install cmake and ninja
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - run: pnpm install --frozen-lockfile
      - run: just build-shell
      - name: App e2e
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a --server-args="-screen 0 1280x800x24" just test-app-e2e' || 'just test-app-e2e' }}
      - name: Install smoke
        # Reports even when a spec failed; skipped only when the run was cancelled.
        if: ${{ !cancelled() }}
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a --server-args="-screen 0 1280x800x24" just smoke' || 'just smoke' }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-results-${{ runner.os }}
          path: e2e/test-results
          retention-days: 7

  perf:
    name: perf
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Configure Ubuntu package downloads
        run: sudo "$(command -v node)" scripts/ci-apt.mjs
      - name: Install the Linux shell build dependencies and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev xvfb
      - run: pnpm install --frozen-lockfile
      - run: just build-shell
      - name: Start-up, idle memory and input latency
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" just perf-app
      - name: Upload results.json and the start-up traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: e2e/test-results/perf
          retention-days: 30
