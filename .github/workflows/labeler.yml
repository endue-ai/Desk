name: labeler

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  pull:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      lines: ${{ steps.pr.outputs.lines }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the selected pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: node scripts/manual-pr.mjs

  area:
    needs: pull
    name: label-area
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
          pr-number: ${{ needs.pull.outputs.number }}

  size:
    needs: pull
    name: label-size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label by changed lines
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.pull.outputs.number }}
          lines: ${{ needs.pull.outputs.lines }}
        run: |
          if   [ "$lines" -lt 10 ];  then size=xs
          elif [ "$lines" -lt 50 ];  then size=s
          elif [ "$lines" -lt 200 ]; then size=m
          elif [ "$lines" -lt 400 ]; then size=l
          else size=xl
          fi
          for other in xs s m l xl; do
            [ "$other" = "$size" ] && continue
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/size:$other" >/dev/null 2>&1 || true
          done
          gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=size:$size" >/dev/null
          echo "$lines changed lines: size:$size"
