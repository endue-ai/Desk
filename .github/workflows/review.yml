name: review

# The reviewer AI: a different session from the author. It never pushes; it only comments.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: review-gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.key.outputs.enabled }}
    steps:
      - id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "enabled=true"; else echo "enabled=false"; fi >> "$GITHUB_OUTPUT"
          [ -n "$ANTHROPIC_API_KEY" ] || echo "ANTHROPIC_API_KEY is not set: review skipped."

  review:
    name: review
    needs: gate
    # Skip without a key, for dependency PRs, drafts, and PRs from forks (no secrets for forks).
    if: >-
      needs.gate.outputs.enabled == 'true' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the model (stronger for specs, permissions and workflows)
        id: model
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE...$HEAD" | grep -qE '^(specs/|\.github/workflows/|apps/desk/src-tauri/capabilities/|crates/desk-core/src/perm)'; then
            echo "model=claude-opus-5-5" >> "$GITHUB_OUTPUT"
          else
            echo "model=claude-sonnet-5-5" >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the reviewer AI for endue Desk, in a different session from the author. Read AGENTS.md
            first. Review this pull request against its linked issue (the "Closes #N" in the body) and
            check exactly these things:

            1. Table vs diff: every row of the As-is → To-be table is backed by changed files, and every
               changed file belongs to a row. Name any mismatch.
            2. Contract: the change satisfies the issue's Acceptance tests and stays inside its Scope.
            3. Tests verify behaviour: tests assert the new behaviour (not just that code runs), would fail
               without the change, and are deterministic (injected clocks, seeded randomness).
            4. Permission safety: no primitive (fs, proc, net, audio, ui) is reachable without the bridge
               permission check; no widened Tauri capabilities, secrets, or new network endpoints without
               a reason in the PR.
            5. The 400-line rule: no source file over 400 lines; generated files are exempt.

            Leave inline comments for specific lines with mcp__github_inline_comment__create_inline_comment,
            then one summary comment with `gh pr comment` that ends with exactly one verdict line:
            "Verdict: approve" or "Verdict: request changes". Do not push commits.
          claude_args: |
            --model ${{ steps.model.outputs.model }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Grep,Glob"
