name: review

# The reviewer AI: a different session from the author. It never pushes; it only comments.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open pull request number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: review-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      pull-requests: read
    name: review-gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.key.outputs.enabled }}
      eligible: ${{ steps.pr.outputs.review }}
      model: ${{ steps.files.outputs.model }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the selected pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: node scripts/manual-pr.mjs
      - name: Select the review model for changed code
        id: files
        if: steps.pr.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > "$RUNNER_TEMP/changed-files"
          if grep -qE '^(specs/|\.github/workflows/|crates/desk-web/src/sender\.rs|crates/desk-core/src/perm)' "$RUNNER_TEMP/changed-files"; then
            echo "model=claude-opus-5-5" >> "$GITHUB_OUTPUT"
          elif grep -qvE '(^docs/|\.md$)' "$RUNNER_TEMP/changed-files"; then
            echo "model=claude-sonnet-5-5" >> "$GITHUB_OUTPUT"
          fi
      - id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "enabled=true"; else echo "enabled=false"; fi >> "$GITHUB_OUTPUT"
          [ -n "$ANTHROPIC_API_KEY" ] || echo "ANTHROPIC_API_KEY is not set: review skipped."

  review:
    name: review
    needs: gate
    if: needs.gate.outputs.enabled == 'true' && needs.gate.outputs.eligible == 'true' && needs.gate.outputs.model != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr }}

            You are the reviewer AI for endue, in a different session from the author. Read AGENTS.md
            first. Read the selected PR with gh pr diff and gh pr view. Review this pull request against its linked issue (the "Closes #N" in the body) and
            check exactly these things:

            1. Table vs diff: every row of the As-is → To-be table is backed by changed files, and every
               changed file belongs to a row. Name any mismatch.
            2. Contract: the change satisfies the issue's Acceptance tests and stays inside its Scope.
            3. Tests verify behaviour: tests assert the new behaviour (not just that code runs), would fail
               without the change, and are deterministic (injected clocks, seeded randomness).
            4. Permission safety: no primitive (fs, proc, net, audio, ui) is reachable without the bridge
               permission check; no widened window commands (crates/desk-web/src/sender.rs), secrets, or
               new network endpoints without a reason in the PR.
            5. The 400-line rule: no source file over 400 lines; generated files are exempt.

            Leave inline comments for specific lines with mcp__github_inline_comment__create_inline_comment,
            then one summary comment with `gh pr comment` that ends with exactly one verdict line:
            "Verdict: approve" or "Verdict: request changes". Do not push commits.
          claude_args: |
            --model ${{ needs.gate.outputs.model }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Grep,Glob"
