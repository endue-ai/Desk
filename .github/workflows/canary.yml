name: canary

# Dispatch on the default branch to check macOS and Windows and publish a signed canary.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: signing
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.secrets.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: secrets
        env:
          ENDUE_UPDATER_PRIVATE_KEY: ${{ secrets.ENDUE_UPDATER_PRIVATE_KEY }}
          ENDUE_UPDATER_PUBLIC_KEY: ${{ vars.ENDUE_UPDATER_PUBLIC_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=""
          for name in ENDUE_UPDATER_PRIVATE_KEY ENDUE_UPDATER_PUBLIC_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::No canary build:$missing not set (docs/releasing.md)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.publish == 'true'
        with:
          fetch-depth: 0
      - id: version
        if: steps.secrets.outputs.publish == 'true'
        run: echo "version=$(node scripts/release-version.mjs --run "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"

  check:
    name: check (${{ matrix.os }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: pnpm install --frozen-lockfile
      - run: just check
      - run: just test-unit

  build:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.gate.outputs.version }}
    secrets: inherit

  publish:
    name: publish
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: signing
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      BASE: ${{ vars.DESK_RELEASES_URL || 'https://releases.endue.ai/desk' }}
      BUCKET: ${{ vars.R2_BUCKET || 'endue-desk-releases' }}
      ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.ENDUE_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.ENDUE_UPDATER_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: endue-app-*
          path: dist
          merge-multiple: true
      - name: Verify the release file list
        run: |
          node scripts/release-manifest.mjs check-files dist --version "$VERSION"
          prefix="$(node scripts/release-assets.mjs desktop-prefix "$VERSION")"
          echo "DESKTOP_PREFIX=$prefix" >> "$GITHUB_ENV"
      - name: Write and sign release.json
        run: |
          node scripts/release-manifest.mjs release dist --version "$VERSION" --base "$BASE" \
            --commit "$GITHUB_SHA" --notes "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" > release.json
          mv release.json dist/release.json
          (cd dist && shopt -s nullglob && sha256sum "$DESKTOP_PREFIX"* "endue-cli_${VERSION}_"* > SHA256SUMS)
          pnpm --filter @endue-ai/desk-app exec tauri signer sign "$PWD/dist/release.json"
      - name: Upload the build
        run: node scripts/release-publish.mjs release dist --version "$VERSION" --bucket "$BUCKET" --endpoint "$ENDPOINT"
      - name: List it on canary and drop canary builds older than two weeks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The bucket's own copy, never the cached public one; a missing index starts at serial 1.
          fetch() {
            if ! out="$(aws s3api get-object --bucket "$BUCKET" --key "desk/channels/$1/index.json" "$1.json" --endpoint-url "$ENDPOINT" 2>&1)"; then
              if grep -q NoSuchKey <<<"$out"; then rm -f "$1.json"; else echo "$out" >&2; exit 1; fi
            fi
          }
          for channel in canary beta stable; do fetch "$channel"; done
          node scripts/release-manifest.mjs list canary.json --channel canary --release dist/release.json > listed.json
          node scripts/release-manifest.mjs prune listed.json --out index.json --days 14 --keep beta.json --keep stable.json > remove.txt
          pnpm --filter @endue-ai/desk-app exec tauri signer sign "$PWD/index.json"
          node scripts/release-publish.mjs index index.json --channel canary --bucket "$BUCKET" --endpoint "$ENDPOINT"
          bash scripts/publish-upgrade-path.sh index index.json canary "$VERSION"
          while read -r old; do
            if [ -n "$old" ]; then
              node scripts/release-publish.mjs remove --version "$old" --bucket "$BUCKET" --endpoint "$ENDPOINT"
            fi
          done < remove.txt
          echo "::notice::canary $VERSION is on $BASE/channels/canary/index.json"
