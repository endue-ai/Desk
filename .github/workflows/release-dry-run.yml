name: release-dry-run

# Rehearse release packaging with a throwaway key on the selected ref or a CI-selected PR merge.
on:
  workflow_dispatch:
    inputs:
      shell:
        description: The endue shell to build (release-shell uses the setting in .github/release-shell)
        type: choice
        options: ["release-shell", "cef"]
        default: release-shell
  workflow_call:
    inputs:
      ref:
        description: The immutable commit selected by CI
        type: string
        required: true

permissions:
  contents: read

# Called from ci, github.workflow is "ci": the call and a run of its own never cancel each other.
concurrency:
  group: release-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  key:
    name: key
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      pubkey: ${{ steps.key.outputs.pubkey }}
      shell: ${{ steps.shell.outputs.shell }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        run: echo "version=$(node scripts/release-version.mjs --run "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"
      - id: shell
        env:
          WANTED: ${{ inputs.shell }}
        # When CI calls this workflow, the selected commit supplies the shell.
        run: |
          if [ -z "$WANTED" ] || [ "$WANTED" = release-shell ]; then WANTED="$(tr -d '[:space:]' < .github/release-shell)"; fi
          echo "shell=$WANTED" >> "$GITHUB_OUTPUT"
      - id: key
        name: Make a throwaway updater key
        # Trusted by nothing outside this run; it lives one day as a run artifact for the builds.
        run: |
          mkdir -p key
          pnpm --filter @endue-ai/desk-app exec tauri signer generate --ci -p dry-run -w "$PWD/key/updater.key"
          echo "pubkey=$(cat key/updater.key.pub)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: dry-run-key
          path: key/
          retention-days: 1

  build:
    needs: key
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.key.outputs.version }}
      shell: ${{ needs.key.outputs.shell }}
      dry-run: true
      ref: ${{ inputs.ref || github.sha }}

  tree:
    name: tree
    needs: [key, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.key.outputs.version }}
      PUBKEY: ${{ needs.key.outputs.pubkey }}
      BASE: https://releases.endue.ai/desk
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: endue-app-*-unsigned
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: dry-run-key
          path: key
      - name: Verify the release file list
        run: |
          node scripts/release-manifest.mjs check-files dist --version "$VERSION"
          prefix="$(node scripts/release-assets.mjs desktop-prefix "$VERSION")"
          echo "DESKTOP_PREFIX=$prefix" >> "$GITHUB_ENV"
      - name: Write and sign release.json and the canary index, as canary does
        env:
          BUILD_COMMIT: ${{ inputs.ref || github.sha }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: dry-run
        run: |
          TAURI_SIGNING_PRIVATE_KEY="$(cat key/updater.key)"
          export TAURI_SIGNING_PRIVATE_KEY
          node scripts/release-manifest.mjs release dist --version "$VERSION" --base "$BASE" \
            --commit "$BUILD_COMMIT" --notes "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$BUILD_COMMIT" > release.json
          mv release.json dist/release.json
          (cd dist && shopt -s nullglob && sha256sum "$DESKTOP_PREFIX"* "endue-cli_${VERSION}_"* > SHA256SUMS)
          pnpm --filter @endue-ai/desk-app exec tauri signer sign "$PWD/dist/release.json"
          node scripts/release-manifest.mjs list missing.json --channel canary --release dist/release.json > index.json
          pnpm --filter @endue-ai/desk-app exec tauri signer sign "$PWD/index.json"
          tree="release-dry-run/desk"
          mkdir -p "$tree/releases/$VERSION" "$tree/channels/canary"
          cp dist/* "$tree/releases/$VERSION/"
          cp index.json index.json.sig "$tree/channels/canary/"
          printf '%s\n' "$PUBKEY" > release-dry-run/updater.pub
      - name: Verify every signature against the run's key
        run: |
          tree="release-dry-run/desk"
          node scripts/release-verify.mjs "$tree/channels/canary/index.json" --pubkey "$PUBKEY"
          node scripts/release-verify.mjs "$tree/releases/$VERSION/release.json" --pubkey "$PUBKEY"
          for sig in "$tree/releases/$VERSION/$DESKTOP_PREFIX"*.sig; do
            node scripts/release-verify.mjs "${sig%.sig}" --pubkey "$PUBKEY"
          done
          node scripts/release-verify.mjs "$tree/releases/$VERSION/endue-cli_${VERSION}_linux-x86_64.tar.gz" --pubkey "$PUBKEY" --version "$VERSION"
          e2e/smoke/verify-signature.sh "$tree/releases/$VERSION/${DESKTOP_PREFIX}linux-x86_64.deb" "$PUBKEY"
      - name: Say what a real publish would need
        run: |
          {
            echo "## Release dry run $VERSION"
            echo
            echo "Built every target, signed with a throwaway key, wrote the R2 tree to the artifact"
            echo "\`release-dry-run\`. Nothing was uploaded. A real publish (canary.yml) also needs, in"
            echo "the \`signing\` environment: \`TAURI_SIGNING_PRIVATE_KEY\`, \`TAURI_SIGNING_PRIVATE_KEY_PASSWORD\`,"
            echo "\`R2_ACCOUNT_ID\`, \`R2_ACCESS_KEY_ID\`, \`R2_SECRET_ACCESS_KEY\`, the Apple secrets for a signed"
            echo "macOS build, and the repository variable \`DESK_UPDATER_PUBKEY\`."
            echo
            echo '```'
            (cd release-dry-run && find . -type f | sort)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: release-dry-run/
          if-no-files-found: error
          retention-days: 7
