name: security

on:
  workflow_dispatch:
    inputs:
      qualify-codeql:
        description: Verify CodeQL analysis before switching the default branch to advanced setup
        type: boolean
        default: false
      report-default:
        description: Analyze the current default branch and publish results after the setup switch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  cargo-deny:
    if: inputs.qualify-codeql != true && inputs.report-default != true
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  cargo-audit:
    if: inputs.qualify-codeql != true && inputs.report-default != true
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  pnpm-audit:
    if: inputs.qualify-codeql != true && inputs.report-default != true
    name: pnpm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm audit --audit-level high

  gitleaks:
    if: inputs.qualify-codeql != true && inputs.report-default != true
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan for secrets
        run: gitleaks git --redact --no-banner .

  preflight-codeql:
    if: inputs.qualify-codeql == true && inputs.report-default != true
    name: CodeQL (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, javascript-typescript, python, rust, swift]
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'swift' && 'manual' || 'none' }}
      - name: Compile the macOS icon utility
        if: matrix.language == 'swift'
        run: xcrun swiftc scripts/app-icons.swift -o "$RUNNER_TEMP/endue-app-icons"
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/endue-codeql-results
          category: /language:${{ matrix.language }}
      - name: Count analyzed rules and results
        shell: python
        env:
          RESULTS: ${{ runner.temp }}/endue-codeql-results
        run: |
          import json
          import os
          from pathlib import Path

          reports = sorted(Path(os.environ["RESULTS"]).glob("*.sarif"))
          assert reports, "CodeQL produced no SARIF report"
          rules = results = 0
          for report in reports:
              for run in json.loads(report.read_text())["runs"]:
                  tool = run["tool"]
                  for component in [tool["driver"], *tool.get("extensions", [])]:
                      rules += len(component.get("rules", []))
                  results += len(run.get("results", []))
          assert rules > 0, "CodeQL analyzed no rules"
          print(f"Analyzed {rules} rules with {results} results.")

  resolve-default:
    if: inputs.report-default == true && inputs.qualify-codeql != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.target.outputs.commit }}
      ref: ${{ steps.target.outputs.ref }}
    steps:
      - name: Resolve the current primary branch
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$BRANCH"
          commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')"
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "ref=refs/heads/$BRANCH" >> "$GITHUB_OUTPUT"

  report-codeql:
    needs: resolve-default
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      commit: ${{ needs.resolve-default.outputs.commit }}
      ref: ${{ needs.resolve-default.outputs.ref }}
