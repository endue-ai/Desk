name: ci

# Dispatch on a selected ref or give an open PR number to test its exact merge with the base.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open PR number (leave empty to test the selected ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.pr || github.ref }}
  cancel-in-progress: false

env:
  ACTIONLINT_VERSION: 1.7.12

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.target.outputs.commit }}
      release-line: ${{ steps.pr.outputs.release == 'true' || (!inputs.pr && startsWith(github.ref, 'refs/heads/release/')) }}
      base: ${{ steps.pr.outputs.base }}
      head: ${{ steps.pr.outputs.head }}
      refactor: ${{ steps.pr.outputs.refactor }}
      app: ${{ steps.filter.outputs.app }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read the selected pull request
        id: pr
        if: inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: node scripts/manual-pr.mjs
      - name: Pin the selected branch or PR merge commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          BASE: ${{ steps.pr.outputs.base }}
          HEAD: ${{ steps.pr.outputs.head }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          commit="$GITHUB_SHA"
          if [ -n "$PR" ]; then
            if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ] && [ "$GITHUB_SHA" != "$HEAD" ]; then
              echo "::error::Select the default branch or the current head of this PR."
              exit 1
            fi
            base_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .base.ref)"
            git fetch --no-tags origin "refs/heads/$base_ref:refs/endue/ci-base" "refs/pull/$PR/merge:refs/endue/ci-merge"
            commit="$(git rev-parse 'refs/endue/ci-merge^{commit}')"
            if [ "$(git rev-parse refs/endue/ci-base)" != "$BASE" ] || [ "$(git rev-parse "$commit^1")" != "$BASE" ] || [ "$(git rev-parse "$commit^2")" != "$HEAD" ]; then
              echo "::error::The PR merge must match the current base and head. Refresh the merge before dispatching again."
              exit 1
            fi
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - id: filter
        env:
          BASE: ${{ steps.pr.outputs.base }}
          COMMIT: ${{ steps.target.outputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$BASE" ]; then
            BASE="$(git merge-base "origin/$DEFAULT_BRANCH" "$COMMIT" || true)"
            if [ "$BASE" = "$COMMIT" ]; then BASE="$(git rev-parse --verify "$COMMIT^" 2>/dev/null || true)"; fi
          fi
          if [ -n "$BASE" ]; then
            files="$(git diff --name-only "$BASE" "$COMMIT")"
          else
            files="$(git ls-tree --name-only -r "$COMMIT")"
          fi
          if grep -qE '^(apps/desk/shell/|crates/desk-web/|crates/desk-sys/|\.github/workflows/ci\.yml$)' <<<"$files"; then app=true; else app=false; fi
          # The files the release dry run proves (including the CLI and installer smokes).
          if grep -qE '^(\.github/workflows/(release|release-build|release-dry-run|release-final|canary)\.yml|\.github/release-shell|scripts/release-[^/]*\.mjs|scripts/(cef-|package-cli).*|crates/desk-cli/|e2e/smoke/(cli-|verify-signature\.sh|install-and-launch\.sh)|apps/desk/shell/packager/.*)$' <<<"$files"; then release=true; else release=false; fi
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"
          echo "release=$release" | tee -a "$GITHUB_OUTPUT"

  linux-verification:
    needs: changes
    name: linux (${{ matrix.recipe }})
    strategy:
      fail-fast: false
      matrix:
        recipe: [check, test-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fit debug-profile builds on the hosted runner while retaining debug assertions.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.commit }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install actionlint
        if: matrix.recipe == 'check'
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          sudo mv actionlint /usr/local/bin/
      - name: Configure Ubuntu package downloads
        run: sudo "$(command -v node)" scripts/ci-apt.mjs
      - name: Install audio headers, the headless Vulkan driver and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libvulkan1 mesa-vulkan-drivers fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: just check
        if: matrix.recipe == 'check'
      - run: just test-unit
        if: matrix.recipe == 'test-unit'

  check-linux:
    name: check (linux)
    if: always()
    needs: linux-verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Linux static checks and unit tests
        env:
          RESULT: ${{ needs.linux-verification.result }}
        run: test "$RESULT" = success

  runtime-e2e-shard:
    needs: changes
    name: runtime-e2e (shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.commit }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: pnpm install --frozen-lockfile
      - name: Configure Ubuntu package downloads
        run: sudo "$(command -v node)" scripts/ci-apt.mjs
      - name: Install Chromium
        run: pnpm --filter @endue-ai/runtime exec playwright install --with-deps chromium
      - run: just test-e2e --shard=${{ matrix.shard }}/4 --workers=1
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: packages/runtime/test-results
          retention-days: 7

  runtime-e2e:
    name: runtime-e2e
    if: always()
    needs: runtime-e2e-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every browser shard passed
        env:
          SHARD_RESULT: ${{ needs.runtime-e2e-shard.result }}
        run: test "$SHARD_RESULT" = success

  check-macos:
    needs: changes
    name: check (macos)
    if: needs.changes.outputs.release-line == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.commit }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: pnpm install --frozen-lockfile
      - run: just check
      - run: just test-unit

  check-windows:
    needs: changes
    name: check (windows)
    if: needs.changes.outputs.release-line == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.commit }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: pnpm install --frozen-lockfile
      - run: just check
      - run: just test-unit

  # The CEF shell (ADR 0143) on every OS, for an app change and for every release pull request: CEF
  # downloads in its build script and cmake builds its C++ wrapper. Not yet among the ci gate's needs:
  # it joins them once it has run green on all three runners.
  shell-build:
    name: shell-build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.release-line == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A cold macOS check and test build takes 36 minutes before the app is packaged.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.commit }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Configure Ubuntu package downloads
        if: runner.os == 'Linux'
        run: sudo "$(command -v node)" scripts/ci-apt.mjs
      - name: Install the Linux shell build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev
      - name: Install the macOS shell build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - run: pnpm install --frozen-lockfile
      - run: just check-shell
      - run: just build-shell

  codegen-check:
    needs: changes
    name: codegen-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.commit }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain (rust-toolchain.toml, for rustfmt)
        run: rustup toolchain install

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - run: pnpm install --frozen-lockfile

      - run: just codegen
      - name: Generated files match the specs
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'just codegen' and commit the result."
            exit 1
          fi

  red-on-base:
    name: red-on-base
    needs: changes
    if: inputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.base }}
          fetch-depth: 0

      - name: Fetch the PR head
        env:
          PR: ${{ inputs.pr }}
        run: git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Run the PR's tests on the base commit
        env:
          BASE: ${{ needs.changes.outputs.base }}
          HEAD: ${{ needs.changes.outputs.head }}
          LABELS: ${{ needs.changes.outputs.refactor == 'true' && 'kind:refactor' || '' }}
        run: |
          # The base version of the script gates the PR; a PR that adds the script uses its own.
          script="$RUNNER_TEMP/red-on-base.sh"
          git show "$BASE:scripts/red-on-base.sh" > "$script" 2>/dev/null || git show "$HEAD:scripts/red-on-base.sh" > "$script"
          bash "$script" "$BASE" "$HEAD"

  release-dry-run:
    name: release-dry-run
    needs: changes
    if: needs.changes.outputs.release-line == 'true' && needs.changes.outputs.release == 'true'
    uses: ./.github/workflows/release-dry-run.yml
    with:
      ref: ${{ needs.changes.outputs.commit }}

  ci:
    name: ci
    if: always()
    needs:
      - changes
      - check-linux
      - runtime-e2e
      - check-macos
      - check-windows
      - codegen-check
      - red-on-base
      - release-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate passed or was skipped on purpose
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' >/dev/null; then
            echo "::error::A gate failed or was cancelled."
            exit 1
          fi
