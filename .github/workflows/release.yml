name: release

# A push to a release line release/vX.Y builds its next candidate (ADR 0092, amending ADR 0081): check
# and unit tests on every OS, the four targets built and signed as X.Y.Z-rc.<run>, uploaded to R2 and
# listed on beta. release-cut.yml's new branch builds the line's first candidate; each merged
# cherry-pick builds the next. Stable comes from release-final.yml once a candidate has been on beta
# three days. A branch that is not a line (release/vX.Y.Z) builds nothing, and without the updater key,
# its public key or the R2 credentials the run fails: a line is meant to ship.
on:
  push:
    branches: ["release/v*"]

permissions:
  contents: read

# One build per line at a time. Beta's index is written under release-index, like every writer of
# the beta and stable indexes.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: signing
    outputs:
      version: ${{ steps.version.outputs.version }}
      shell: ${{ steps.shell.outputs.shell }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: The candidate's version
        run: echo "version=$(node scripts/release-version.mjs --line "$GITHUB_REF_NAME" --run "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"
      - id: shell
        name: The desk the line builds (.github/release-shell, #46)
        run: |
          shell="$(tr -d '[:space:]' < .github/release-shell)"
          case "$shell" in tauri | cef) ;; *) echo "::error::.github/release-shell names $shell, not tauri or cef"; exit 1 ;; esac
          echo "shell=$shell" >> "$GITHUB_OUTPUT"
      - name: The updater key, its public key and the R2 credentials are set
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          DESK_UPDATER_PUBKEY: ${{ vars.DESK_UPDATER_PUBKEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=""
          for name in TAURI_SIGNING_PRIVATE_KEY DESK_UPDATER_PUBKEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::$GITHUB_REF_NAME builds no candidate:$missing not set (docs/releasing.md)"
            exit 1
          fi

  check:
    name: check (${{ matrix.os }})
    needs: gate
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Configure Ubuntu package downloads
        if: runner.os == 'Linux'
        run: sudo "$(command -v node)" scripts/ci-apt.mjs
      - name: Install the ALSA headers (cpal, for desk-sys audio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - run: pnpm install --frozen-lockfile
      - run: just check
      - run: just test-unit

  build:
    needs: [gate, check]
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.gate.outputs.version }}
      shell: ${{ needs.gate.outputs.shell }}
    secrets: inherit

  publish:
    name: publish
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: signing
    concurrency:
      group: release-index
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      BASE: ${{ vars.DESK_RELEASES_URL || 'https://releases.endue.ai/desk' }}
      BUCKET: ${{ vars.R2_BUCKET || 'endue-desk-releases' }}
      ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: desk-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/endue-desk_*
      - name: Write and sign release.json
        run: |
          node scripts/release-manifest.mjs release dist --version "$VERSION" --base "$BASE" \
            --commit "$GITHUB_SHA" --notes "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" > release.json
          mv release.json dist/release.json
          (cd dist && sha256sum endue-desk_* > SHA256SUMS)
          pnpm --filter @endue-ai/desk-app exec tauri signer sign "$PWD/dist/release.json"
      - name: Upload the build
        run: node scripts/release-publish.mjs release dist --version "$VERSION" --bucket "$BUCKET" --endpoint "$ENDPOINT"
      - name: List it on beta
        run: |
          # The bucket's own copy, never the cached public one; a missing index starts at serial 1.
          if ! out="$(aws s3api get-object --bucket "$BUCKET" --key desk/channels/beta/index.json beta.json --endpoint-url "$ENDPOINT" 2>&1)"; then
            if grep -q NoSuchKey <<<"$out"; then rm -f beta.json; else echo "$out" >&2; exit 1; fi
          fi
          node scripts/release-manifest.mjs list beta.json --channel beta --release dist/release.json > index.json
          pnpm --filter @endue-ai/desk-app exec tauri signer sign "$PWD/index.json"
          node scripts/release-publish.mjs index index.json --channel beta --bucket "$BUCKET" --endpoint "$ENDPOINT"
          echo "::notice::candidate $VERSION of $GITHUB_REF_NAME is on $BASE/channels/beta/index.json"
