name: release

# Dispatch on a release/vX.Y branch to check every OS and publish its next candidate on beta.
on:
  workflow_dispatch:

permissions:
  contents: read

# One build per line at a time. Beta's index is written under release-index, like every writer of
# the beta and stable indexes.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    if: startsWith(github.ref, 'refs/heads/release/v')
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: signing
    outputs:
      version: ${{ steps.version.outputs.version }}
      shell: ${{ steps.shell.outputs.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        name: The candidate's version
        run: |
          version="$(node scripts/release-version.mjs --line "$GITHUB_REF_NAME" --run "$GITHUB_RUN_NUMBER")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: shell
        name: Select the endue shell for this release line
        run: |
          shell="$(tr -d '[:space:]' < .github/release-shell)"
          case "$shell" in tauri | cef) ;; *) echo "::error::.github/release-shell names $shell, not tauri or cef"; exit 1 ;; esac
          echo "shell=$shell" >> "$GITHUB_OUTPUT"
      - name: The updater key, its public key and the R2 credentials are set
        env:
          ENDUE_UPDATER_PRIVATE_KEY: ${{ secrets.ENDUE_UPDATER_PRIVATE_KEY }}
          ENDUE_UPDATER_PUBLIC_KEY: ${{ vars.ENDUE_UPDATER_PUBLIC_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=""
          for name in ENDUE_UPDATER_PRIVATE_KEY ENDUE_UPDATER_PUBLIC_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::$GITHUB_REF_NAME builds no candidate:$missing not set (docs/releasing.md)"
            exit 1
          fi

  check:
    name: check (${{ matrix.os }})
    needs: gate
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: just
      - name: Configure Ubuntu package downloads
        if: runner.os == 'Linux'
        run: sudo "$(command -v node)" scripts/ci-apt.mjs
      - name: Install ALSA headers for endue audio
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - run: pnpm install --frozen-lockfile
      - run: just check
      - run: just test-unit

  build:
    needs: [gate, check]
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.gate.outputs.version }}
      shell: ${{ needs.gate.outputs.shell }}
    secrets: inherit

  publish:
    name: publish
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: signing
    concurrency:
      group: release-index
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      BASE: ${{ vars.DESK_RELEASES_URL || 'https://releases.endue.ai/desk' }}
      BUCKET: ${{ vars.R2_BUCKET || 'endue-desk-releases' }}
      ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.ENDUE_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.ENDUE_UPDATER_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: endue-app-*
          path: dist
          merge-multiple: true
      - name: Verify the release file list
        run: |
          node scripts/release-manifest.mjs check-files dist --version "$VERSION"
          prefix="$(node scripts/release-assets.mjs desktop-prefix "$VERSION")"
          echo "DESKTOP_PREFIX=$prefix" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/${{ env.DESKTOP_PREFIX }}*
            dist/endue-cli_*
      - name: Write and sign release.json
        run: |
          node scripts/release-manifest.mjs release dist --version "$VERSION" --base "$BASE" \
            --commit "$GITHUB_SHA" --notes "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" > release.json
          mv release.json dist/release.json
          (cd dist && shopt -s nullglob && sha256sum "$DESKTOP_PREFIX"* "endue-cli_${VERSION}_"* > SHA256SUMS)
          pnpm --filter @endue-ai/desk-app exec tauri signer sign "$PWD/dist/release.json"
      - name: Upload the build
        run: node scripts/release-publish.mjs release dist --version "$VERSION" --bucket "$BUCKET" --endpoint "$ENDPOINT"
      - name: List it on beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The bucket's own copy, never the cached public one; a missing index starts at serial 1.
          if ! out="$(aws s3api get-object --bucket "$BUCKET" --key desk/channels/beta/index.json beta.json --endpoint-url "$ENDPOINT" 2>&1)"; then
            if grep -q NoSuchKey <<<"$out"; then rm -f beta.json; else echo "$out" >&2; exit 1; fi
          fi
          node scripts/release-manifest.mjs list beta.json --channel beta --release dist/release.json > index.json
          pnpm --filter @endue-ai/desk-app exec tauri signer sign "$PWD/index.json"
          node scripts/release-publish.mjs index index.json --channel beta --bucket "$BUCKET" --endpoint "$ENDPOINT"
          bash scripts/publish-upgrade-path.sh index index.json beta "$VERSION"
          echo "::notice::candidate $VERSION of $GITHUB_REF_NAME is on $BASE/channels/beta/index.json"
