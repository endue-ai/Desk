name: plugin-validate

on:
  pull_request:
    paths:
      - ".github/workflows/plugin-validate.yml"
      - "scripts/example.mjs"
      - "plugins/**"
      - "examples/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/plugin-validate.yml"
      - "scripts/example.mjs"
      - "plugins/**"
      - "examples/**"

permissions:
  contents: read

concurrency:
  group: plugin-validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin-validate:
    name: plugin-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --locked -p desk-cli --bin endue

      - name: Build native examples for this platform
        run: |
          for manifest in examples/*/plugin.json; do
            [ -f "$manifest" ] || continue
            name="${manifest#examples/}"
            node scripts/example.mjs build "${name%/plugin.json}"
          done

      - name: Validate plugin manifests with endue
        run: |
          status=0
          for manifest in plugins/*/plugin.json examples/*/plugin.json; do
            [ -f "$manifest" ] || continue
            dir="$(dirname "$manifest")"
            if ./target/debug/endue plugin validate "$dir"; then :; else status=1; fi
          done
          exit "$status"
