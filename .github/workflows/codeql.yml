name: codeql

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, javascript-typescript, python, rust, swift]
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'swift' && 'manual' || 'none' }}
      - name: Compile the macOS icon utility
        if: matrix.language == 'swift'
        run: xcrun swiftc scripts/app-icons.swift -o "$RUNNER_TEMP/endue-app-icons"
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
