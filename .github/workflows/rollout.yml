name: rollout

# Adjust the share of stable endue installations offered a version (ADR 0092). The initial share
# is 10%. Choose 50 or 100 to reach more installations, or 0 to stop offering this version.
# Each installation keeps the same bucket for a version. Use rollback.yml to withdraw a staged build.
# A maintainer approves the rollout in the stable environment.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The stable version, without a leading v
        required: true
        type: string
      percent:
        description: Percentage of stable endue installations offered this version
        required: true
        type: choice
        options: ["50", "100", "10", "0"]

permissions:
  contents: read

jobs:
  rollout:
    permissions:
      contents: write
    name: rollout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: stable
    concurrency:
      group: release-index
      cancel-in-progress: false
    env:
      VERSION: ${{ inputs.version }}
      PERCENT: ${{ inputs.percent }}
      BUCKET: ${{ vars.R2_BUCKET || 'endue-desk-releases' }}
      ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.ENDUE_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.ENDUE_UPDATER_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set ${{ inputs.version }} to ${{ inputs.percent }}% on stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          aws s3api get-object --bucket "$BUCKET" --key desk/channels/stable/index.json current.json \
            --endpoint-url "$ENDPOINT" > /dev/null
          node scripts/release-manifest.mjs rollout current.json --version "$VERSION" --percent "$PERCENT" > index.json
          pnpm --filter @endue-ai/desk-app exec tauri signer sign "$PWD/index.json"
          bash scripts/publish-upgrade-path.sh index index.json stable "$VERSION"
          node scripts/release-publish.mjs index index.json --channel stable --bucket "$BUCKET" --endpoint "$ENDPOINT"
          echo "::notice::endue $VERSION is available to $PERCENT% of stable installations"
