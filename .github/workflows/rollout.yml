name: rollout

# Widen or stop a stable build's rollout (ADR 0090), by hand only: the share of desks that see it, 10
# when release-final.yml lists it, then 50 and 100; 0 stops new desks from taking it. A desk's bucket
# for a version never changes, so a wider share only adds desks. Taking a build off every desk that
# staged it is rollback.yml. Runs in the stable environment, which people approve.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The stable version, without a leading v
        required: true
        type: string
      percent:
        description: The share of desks that see it
        required: true
        type: choice
        options: ["50", "100", "10", "0"]

permissions:
  contents: read

jobs:
  rollout:
    name: rollout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: stable
    concurrency:
      group: release-index
      cancel-in-progress: false
    env:
      VERSION: ${{ inputs.version }}
      PERCENT: ${{ inputs.percent }}
      BUCKET: ${{ vars.R2_BUCKET || 'endue-desk-releases' }}
      ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set ${{ inputs.version }} to ${{ inputs.percent }}% on stable
        run: |
          aws s3api get-object --bucket "$BUCKET" --key desk/channels/stable/index.json current.json \
            --endpoint-url "$ENDPOINT" > /dev/null
          node scripts/release-manifest.mjs rollout current.json --version "$VERSION" --percent "$PERCENT" > index.json
          pnpm --filter @endue-ai/desk-app exec tauri signer sign "$PWD/index.json"
          node scripts/release-publish.mjs index index.json --channel stable --bucket "$BUCKET" --endpoint "$ENDPOINT"
          echo "::notice::$VERSION reaches $PERCENT% of stable desks"
