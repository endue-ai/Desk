name: Bug report
description: Something in Desk does not work as it should.
title: "bug: "
labels: ["kind:bug"]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The shortest sequence of steps that shows the problem.
      placeholder: |
        1. Open Desk
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
      description: What you expected to happen, and what happened instead.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Desk version and channel
      placeholder: "0.1.0 (canary)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove tokens, paths and anything personal before pasting.
      render: text
